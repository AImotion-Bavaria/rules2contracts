rule_id: R_I1_llm
description: Stopping on the main carriageway of an interstate is prohibited unless there is congestion or the directly leading vehicle is stationary.
source_text: StVO §12(1)/§18(8)
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5       # standstill threshold [m/s]
  EPS_V: 0.5              # perception lead-velocity error bound [m/s]
  V_TRACKING_ERROR: 1.0  # plant tracking error bound [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}   # congestion boolean signal
    - {name: v_true_lead, sort: real}   # true lead-vehicle velocity [m/s]

system_contract:
  interface: {inputs: [congestion, v_true_lead], outputs: [v_ego]}
  assumption: "G(congestion or v_true_lead <= V_STANDSTILL)"
  guarantee: "G(v_true_lead > V_STANDSTILL -> F[0,8](v_ego > V_STANDSTILL))"

decomposition:
  discharge_order: [Perception, Localization, Control]
  contracts:
    - service: Perception
      interface: {inputs: [v_true_lead], outputs: [v_lead]}
      assumption: "G(v_true_lead >= 0)"
      guarantee: "G(abs(v_lead - v_true_lead) <= EPS_V)"

    - service: Localization
      interface: {inputs: [v_ego], outputs: [v_ego]}
      assumption: "G(v_ego >= 0)"
      guarantee: "G(abs(v_ego - v_true_ego) <= EPS_V)"

    - service: Control
      interface: {inputs: [v_ego, v_lead], outputs: [v_cmd]}
      assumption: "G(v_ego >= 0 and v_lead >= 0)"
      guarantee: "G((v_true_lead > V_STANDSTILL and v_ego <= V_STANDSTILL) -> F[0,8](v_cmd > V_STANDSTILL))"