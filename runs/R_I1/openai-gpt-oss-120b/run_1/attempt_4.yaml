rule_id: R_I1_llm
description: >
  Stopping on the main carriageway of an interstate is prohibited unless there
  is congestion or the directly leading vehicle is stationary. At feature level:
  whenever there is no congestion and the true lead‑vehicle velocity is clearly
  above the standstill threshold (0.5 m/s), the ego vehicle must keep moving
  (true ego velocity at least 0.5 m/s).
source_text: >
  StVO §12(1)/§18(8): "Stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is
  stationary."
sampling_rate_hz: 10
horizon: 8

constants:
  THRESH: 0.5        # standstill threshold [m/s]
  EPS_LEAD: 0.5      # perception lead‑velocity error bound [m/s]
  EPS_VTRACK: 1.0    # plant tracking error bound [m/s]
  EPS_LOC: 0.5       # localization velocity error bound [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}   # true lead‑vehicle velocity [m/s]
    - {name: v_true, sort: real}        # true ego velocity [m/s]

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_true], outputs: []}
  assumption: "G(v_true >= 0 and v_lead_true >= 0 and abs(v_true - v_cmd) <= EPS_VTRACK)"
  guarantee: "G((not congestion and v_lead_true > THRESH) -> v_true >= THRESH)"

decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_LOC)"

    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_LEAD)"

    - service: Planning
      interface: {inputs: [v_ego, v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_ego >= -EPS_LOC and v_lead >= -EPS_LEAD)"
      guarantee: "G((not congestion and v_lead > THRESH - EPS_LEAD) -> v_cmd >= THRESH + EPS_VTRACK)"