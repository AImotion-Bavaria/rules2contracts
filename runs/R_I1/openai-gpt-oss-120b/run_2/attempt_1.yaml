rule_id: R_I1_llm
description: >
  Stopping on the main carriageway of an interstate is prohibited unless there is
  congestion or the directly leading vehicle is stationary. Formally, when there
  is no congestion and the true lead‑vehicle velocity is above the standstill
  threshold (0.5 m/s), the ego vehicle must keep moving (true ego velocity ≥ 0.5 m/s).
source_text: >
  StVO §12(1)/§18(8): “Stopping on the main carriageway of an interstate is prohibited
  unless there is congestion or the directly leading vehicle is stationary.”
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5    # standstill threshold [m/s]
  EPS_LEAD: 0.5        # perception lead‑velocity error bound [m/s]
  EPS_VEGO: 1.0        # plant tracking error bound for ego velocity [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}   # true lead‑vehicle velocity [m/s]
    - {name: v_ego_true, sort: real}    # true ego velocity [m/s]

system_contract:
  interface:
    inputs: [congestion, v_lead_true, v_ego_true]
    outputs: [v_cmd]
  assumption: "G(abs(v_ego_true - v_cmd) <= EPS_VEGO)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> v_ego_true >= V_STANDSTILL)"

decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface:
        inputs: [v_lead_true]
        outputs: [v_lead]
      assumption: "G(true)"   # no specific assumption on the environment beyond its definition
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_LEAD)"

    - service: Planning
      interface:
        inputs: [v_ego, v_lead, congestion]
        outputs: [v_cmd]
      assumption: "G(v_ego >= 0)"   # ego velocity estimate is non‑negative
      guarantee: "G((not congestion and v_lead > V_STANDSTILL + EPS_LEAD) -> v_cmd >= V_STANDSTILL + EPS_VEGO)"