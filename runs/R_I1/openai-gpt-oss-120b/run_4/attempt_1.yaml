rule_id: R_I1_llm
description: >
  Stopping on the main carriageway of an interstate is prohibited unless there
  is congestion or the directly leading vehicle is stationary. Formally,
  whenever there is no congestion and the true lead‑vehicle velocity exceeds
  the standstill threshold (0.5 m/s), the ego vehicle must keep moving
  (true ego velocity at least 0.5 m/s). Perception estimates lead velocity with
  a bounded error of 0.5 m/s and the plant tracks the commanded velocity within
  1.0 m/s.
source_text: >
  StVO §12(1)/§18(8): "Stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is
  stationary."
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5   # standstill threshold [m/s]
  EPS_LEAD: 0.5       # perception lead‑velocity error bound [m/s]
  EPS_EGO: 1.0        # plant tracking error bound [m/s]
  V_MAX: 70.0         # maximum considered speed [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}   # true lead‑vehicle velocity [m/s]
    - {name: v_ego_true, sort: real}    # true ego‑vehicle velocity [m/s]

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_ego_true], outputs: []}
  assumption: "G(congestion == false or congestion == true) and G(v_lead_true >= 0 and v_lead_true <= V_MAX and v_ego_true >= 0 and v_ego_true <= V_MAX)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> v_ego_true >= V_STANDSTILL)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0 and v_lead_true <= V_MAX)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_LEAD)"

    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0)"
      guarantee: "G((not congestion and v_lead >= V_STANDSTILL - EPS_LEAD) -> v_cmd >= V_STANDSTILL + EPS_EGO)"

    - service: Control
      interface: {inputs: [v_cmd], outputs: [v_ego_true]}
      assumption: "G(v_cmd >= 0)"
      guarantee: "G(abs(v_ego_true - v_cmd) <= EPS_EGO)"