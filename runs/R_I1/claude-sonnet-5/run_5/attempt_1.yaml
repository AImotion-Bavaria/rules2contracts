rule_id: R_I1_llm
description: >
  Stopping ban on the main carriageway of an interstate (StVO §12(1)/§18(8)):
  stopping is prohibited unless there is congestion or the directly leading
  vehicle is stationary. Formalized at feature level: whenever there is no
  congestion and the true lead-vehicle velocity is clearly above the
  standstill threshold, the ego vehicle must keep moving (true ego velocity
  at least the standstill threshold). Perception's lead-velocity estimate is
  used by Planning to command a velocity, and the plant tracks the commanded
  velocity within a bounded error, so the trigger threshold used by Planning
  must be tightened (lowered) by the perception error bound and the
  commanded-velocity floor raised by the plant tracking error bound.
source_text: >
  "Auf der Fahrbahn der Autobahnen ... ist ... das Halten verboten. Ausgenommen
  ... ist das Halten bei Verkehrsstau oder wenn das unmittelbar vorausfahrende
  Fahrzeug hält." (StVO §12(1), §18(8), paraphrased)
sampling_rate_hz: 10
horizon: 8

constants:
  V_STOP: 0.5      # standstill threshold [m/s]
  EPS_VL: 0.5      # perception lead-velocity error bound [m/s]
  EPS_PLANT: 1.0   # plant tracking error bound on commanded velocity [m/s]
  V_MAX: 70.0      # max considered velocity [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_ego_true, sort: real}

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_ego_true], outputs: [v_cmd]}
  assumption: "G(abs(v_ego_true - v_cmd) <= EPS_PLANT and v_lead_true >= 0 and v_lead_true <= V_MAX)"
  guarantee: "G((not congestion and v_lead_true > V_STOP) -> v_ego_true >= V_STOP)"

decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0 and v_lead_true <= V_MAX)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_VL)"

    - service: Planning
      interface: {inputs: [congestion, v_lead], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_VL)"
      guarantee: "G((not congestion and v_lead > V_STOP - EPS_VL) -> v_cmd >= V_STOP + EPS_PLANT)"
