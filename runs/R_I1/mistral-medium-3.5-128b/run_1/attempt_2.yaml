rule_id: R_I1_llm
description: >
  Stopping prohibition on interstate main carriageway (StVO §12(1)/§18(8)): stopping is prohibited unless there is congestion or the directly leading vehicle is stationary. At feature level: if no congestion and true lead velocity > 0.5 m/s, ego must maintain v_true >= 0.5 m/s.
source_text: >
  StVO §12(1)/§18(8): "Stopping on the main carriageway of an interstate is prohibited unless there is congestion or the directly leading vehicle is stationary."
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5    # standstill threshold [m/s]
  EPS_V_LEAD: 0.5     # perception lead-velocity error bound [m/s]
  EPS_V_TRACK: 1.0    # plant tracking error bound (v_cmd -> v_true) [m/s]

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}   # true lead-vehicle velocity [m/s]
    - {name: v_true, sort: real}        # true ego velocity [m/s]

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_true], outputs: [v_cmd]}
  assumption: "G(v_lead_true >= 0 and v_true >= 0)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> (v_true >= V_STANDSTILL))"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"

    - service: Planning
      interface: {inputs: [v_ego, v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_V_LEAD and v_ego >= 0)"
      guarantee: "G((not congestion and v_lead > V_STANDSTILL + EPS_V_LEAD) -> (v_cmd >= V_STANDSTILL + EPS_V_TRACK))"

    - service: Control
      interface: {inputs: [v_ego, v_cmd], outputs: [a_cmd, v_true]}
      assumption: "G(v_cmd >= 0)"
      guarantee: "G(abs(v_true - v_cmd) <= EPS_V_TRACK)"