rule_id: R_I1_llm
description: >
  Stopping prohibition on interstate main carriageway (StVO §12(1)/§18(8)):
  Stopping is prohibited unless there is congestion or the directly leading
  vehicle is stationary. At feature level: if no congestion and true lead
  velocity > 0.5 m/s, then ego must keep moving (v_true >= 0.5 m/s).
source_text: >
  StVO §12(1): "Das Halten ist auf Autobahnen nur auf ausgewiesenen Parkplätzen erlaubt."
  StVO §18(8): "Auf Autobahnen darf nur an gekennzeichneten Parkplätzen gehalten werden, es sei denn, es liegt Stau vor oder das direkt vorausfahrende Fahrzeug steht."
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5
  EPS_V_LEAD: 0.5
  EPS_V_TRACK: 1.0

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_true], outputs: []}
  assumption: "G(v_lead_true >= 0 and v_true >= 0)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> v_true >= V_STANDSTILL)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"

    - service: Planning
      interface: {inputs: [congestion, v_ego, a_ego, d_lead, v_lead], outputs: [v_cmd, a_plan]}
      assumption: "G(v_lead >= 0 - EPS_V_LEAD)"
      guarantee: "G((not congestion and v_lead > V_STANDSTILL + EPS_V_LEAD) -> v_cmd >= V_STANDSTILL + EPS_V_TRACK)"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan, v_true], outputs: [a_cmd, gear_rev_cmd]}
      assumption: "G(v_cmd >= 0)"
      guarantee: "G(abs(v_true - v_cmd) <= EPS_V_TRACK)"