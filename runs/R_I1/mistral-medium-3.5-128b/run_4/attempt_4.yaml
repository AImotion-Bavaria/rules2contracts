rule_id: R_I1_llm
description: >
  Stopping prohibition on interstate main carriageway (StVO §12(1)/§18(8)):
  Stopping is prohibited unless congestion or the directly leading vehicle is stationary.
  At feature level: if no congestion and true lead velocity > 0.5 m/s, then ego must keep moving (v_true >= 0.5 m/s).
source_text: >
  StVO §12(1): "Das Halten ist auf Autobahnen nur auf ausgewiesenen Parkplätzen erlaubt."
  StVO §18(8): "Auf Autobahnen darf nur an gekennzeichneten Parkplätzen gehalten werden, es sei denn, es liegt Stau vor oder das direkt vorausfahrende Fahrzeug steht."
sampling_rate_hz: 10
horizon: 8

constants:
  V_STANDSTILL: 0.5
  EPS_V_LEAD: 0.5
  EPS_V_TRACK: 1.0
  V_MIN: 0.0

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_true], outputs: []}
  assumption: "G(v_lead_true >= V_MIN and v_true >= V_MIN)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> (v_true >= V_STANDSTILL))"

decomposition:
  discharge_order: [Localization, Perception, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego, a_ego]}
      assumption: "G(v_true >= V_MIN)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V_TRACK and v_ego >= V_MIN)"

    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead, d_lead]}
      assumption: "G(v_lead_true >= V_MIN)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD and v_lead >= V_MIN)"

    - service: Planning
      interface: {inputs: [v_ego, a_ego, v_lead, d_lead, congestion], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego >= V_MIN and v_lead >= V_MIN)"
      guarantee: "G((not congestion and v_lead > V_STANDSTILL + EPS_V_LEAD) -> (v_cmd >= V_STANDSTILL + EPS_V_TRACK))"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [a_cmd, gear_rev_cmd]}
      assumption: "G(v_ego >= V_MIN and v_cmd >= V_MIN)"
      guarantee: "G(abs(v_ego - v_cmd) <= EPS_V_TRACK)"