rule_id: R_I1_llm
description: >
  Stopping on the main carriageway of an interstate is prohibited unless
  there is congestion or the directly leading vehicle is stationary.
  Interpreted at feature level: whenever there is no congestion and the
  true lead-vehicle velocity is clearly above the standstill threshold,
  the ego vehicle must keep moving.
source_text: >
  StVO §12(1)/§18(8): stopping on the main carriageway of an interstate
  is prohibited unless there is congestion or the directly leading vehicle
  is stationary.
sampling_rate_hz: 10
horizon: 8
constants:
  V_STOP: 0.5
  EPS_V_LEAD: 0.5
  EPS_PLANT: 1.0
  THRESH_LEAD: 0.0
  THRESH_CMD: 1.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_true, sort: real}
system_contract:
  interface: {inputs: [congestion, v_lead_true, v_true], outputs: [v_lead, v_cmd]}
  assumption: "G(abs(v_true - v_cmd) <= EPS_PLANT and v_lead_true >= 0)"
  guarantee: "G((not congestion and v_lead_true > V_STOP) -> v_true >= V_STOP)"
decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"
    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= -EPS_V_LEAD)"
      guarantee: "G((not congestion and v_lead > THRESH_LEAD) -> v_cmd >= THRESH_CMD)"