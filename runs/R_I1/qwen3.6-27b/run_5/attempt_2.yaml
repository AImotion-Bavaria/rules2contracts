rule_id: R_I1_llm
description: >
  StVO §12(1)/§18(8) stopping prohibition on interstate main carriageway:
  unless congestion occurs or the lead vehicle is stationary, the ego
  vehicle must maintain motion above the standstill threshold.
source_text: >
  StVO §12(1)/§18(8): "Stopping on the main carriageway of an interstate
  is prohibited unless there is congestion or the directly leading vehicle
  is stationary."
sampling_rate_hz: 10
horizon: 8
constants:
  V_STANDSTILL: 0.5
  EPS_V_LEAD: 0.5
  EPS_PLANT: 1.0
  V_LEAD_THRESH: 0.0
  V_CMD_THRESH: 1.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_ego_true, sort: real}
system_contract:
  interface: {inputs: [congestion, v_lead_true, v_ego_true], outputs: [v_cmd]}
  assumption: "G(v_lead_true >= 0 and v_ego_true >= 0 and abs(v_ego_true - v_cmd) <= EPS_PLANT)"
  guarantee: "G((not congestion and v_lead_true > V_STANDSTILL) -> v_ego_true >= V_STANDSTILL)"
decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"
    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0)"
      guarantee: "G((not congestion and v_lead >= V_LEAD_THRESH) -> v_cmd >= V_CMD_THRESH)"