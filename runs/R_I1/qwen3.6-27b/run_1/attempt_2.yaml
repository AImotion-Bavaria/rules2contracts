rule_id: R_I1_llm
description: >
  Formalization of StVO §12(1)/§18(8) stopping prohibition on interstates.
  Ensures the ego vehicle maintains a minimum velocity when not congested
  and the lead vehicle is moving, compensating for perception and plant tracking errors.
source_text: >
  StVO §12(1)/§18(8): stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is stationary.
sampling_rate_hz: 10
horizon: 8
constants:
  V_STOP: 0.5
  EPS_V_LEAD: 0.5
  EPS_PLANT: 1.0
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_ego_true, sort: real}
system_contract:
  interface: {inputs: [congestion, v_lead_true, v_ego_true], outputs: [v_cmd]}
  assumption: "G(v_lead_true >= 0 and v_ego_true >= 0 and abs(v_ego_true - v_cmd) <= EPS_PLANT)"
  guarantee: "G((not congestion and v_lead_true > V_STOP) -> v_ego_true >= V_STOP)"
decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"
    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_V_LEAD)"
      guarantee: "G((not congestion and v_lead > V_STOP - EPS_V_LEAD) -> v_cmd >= V_STOP + EPS_PLANT)"