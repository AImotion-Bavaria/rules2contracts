rule_id: R_I1_llm
description: >
  Interstate stopping prohibition (StVO §12(1)/§18(8)): stopping on the main
  carriageway is prohibited unless congested or the lead vehicle is stationary.
  Formalized: if not congested and lead velocity exceeds standstill threshold,
  ego velocity must exceed standstill threshold.
source_text: >
  StVO §12(1)/§18(8): "Stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is
  stationary." Interpretation: If no congestion and lead vehicle is moving
  (> 0.5 m/s), ego vehicle must keep moving (>= 0.5 m/s).
sampling_rate_hz: 10
horizon: 8

constants:
  V_STOP: 0.5
  EPS_V_LEAD: 0.5
  EPS_V_TRACK: 1.0
  V_MAX: 70.0

environment:
  signals:
    - {name: v_lead_true, sort: real}
    - {name: v_ego_true, sort: real}
    - {name: congestion, sort: bool}

system_contract:
  interface: {inputs: [v_lead_true, v_ego_true, congestion], outputs: [v_cmd]}
  assumption: "G(abs(v_ego_true - v_cmd) <= EPS_V_TRACK and v_lead_true >= 0 and v_lead_true <= V_MAX)"
  guarantee: "G((not congestion and v_lead_true > V_STOP) -> v_ego_true >= V_STOP)"

decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0 and v_lead_true <= V_MAX)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_V_LEAD)"

    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_V_LEAD)"
      guarantee: "G((not congestion and v_lead > V_STOP - EPS_V_LEAD) -> v_cmd >= V_STOP + EPS_V_TRACK)"