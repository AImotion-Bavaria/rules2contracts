rule_id: R_I1_llm
description: >
  StVO §12(1)/§18(8) stopping prohibition on interstates: unless congested or
  lead vehicle stationary, ego must keep moving (v_ego_true >= 0.5 m/s).
  Formalized with perception and plant tracking error margins. "Clearly above"
  interpreted as exceeding threshold plus perception error bound.
source_text: >
  StVO §12(1) / §18(8): "Stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is
  stationary." Interpretation: If no congestion and lead velocity > 0.5 m/s,
  ego velocity must be >= 0.5 m/s.
sampling_rate_hz: 10
horizon: 10

constants:
  V_STOP_THR: 0.5
  EPS_LEAD: 0.5
  EPS_TRACK: 1.0
  EPS_LOC: 0.5

environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: v_lead_true, sort: real}
    - {name: v_ego_true, sort: real}

system_contract:
  interface: {inputs: [congestion, v_lead_true, v_ego_true], outputs: [v_cmd]}
  assumption: "G(v_lead_true >= 0 and v_ego_true >= 0 and abs(v_ego_true - v_cmd) <= EPS_TRACK)"
  guarantee: "G((not congestion and v_lead_true > V_STOP_THR + EPS_LEAD) -> v_ego_true >= V_STOP_THR)"

decomposition:
  discharge_order: [Perception, Localization, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_LEAD)"

    - service: Localization
      interface: {inputs: [v_ego_true], outputs: [v_ego]}
      assumption: "G(v_ego_true >= 0)"
      guarantee: "G(abs(v_ego - v_ego_true) <= EPS_LOC)"

    - service: Planning
      interface: {inputs: [v_lead, v_ego, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= -EPS_LEAD and v_ego >= -EPS_LOC)"
      guarantee: "G((not congestion and v_lead > V_STOP_THR) -> v_cmd >= V_STOP_THR + EPS_TRACK)"