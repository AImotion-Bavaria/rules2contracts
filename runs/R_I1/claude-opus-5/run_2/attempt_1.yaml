rule_id: R_I1_llm
description: >
  Prohibition of stopping on the main carriageway of an interstate
  (StVO §12(1) in conjunction with §18(8)). Stopping is only admissible if
  there is congestion or if the directly leading vehicle is itself
  stationary. At feature level: whenever no congestion is present and the
  true velocity of the directly leading vehicle is clearly above the
  standstill threshold V_STOP = 0.5 m/s, the ego vehicle must keep moving,
  i.e. its true velocity must stay at or above V_STOP. Perception estimates
  the lead velocity with a bounded error EPS_VL, so the Planning trigger
  threshold is loosened by that bound; the plant tracks the commanded
  velocity within EPS_TRACK, so the commanded velocity is raised by that
  bound.
source_text: >
  StVO §12(1): "Das Halten ist unzulaessig ..." in conjunction with
  StVO §18(8): "Auf Autobahnen und Kraftfahrstrassen ist das Halten, auch
  auf Seitenstreifen, verboten." Exception applied here: standing still is
  tolerated in congestion or when the directly leading vehicle is
  stationary.
sampling_rate_hz: 10
horizon: 8

constants:
  V_STOP: 0.5       # standstill threshold [m/s]
  V_CLEAR: 2.0      # lead velocity "clearly above standstill" [m/s]
  EPS_VL: 0.5       # perception lead-velocity error bound [m/s]
  EPS_TRACK: 1.0    # plant velocity tracking error bound [m/s]
  V_MAX: 70.0       # max considered velocity [m/s]

environment:
  signals:
    - {name: v_ego_true, sort: real}    # true ego velocity [m/s]
    - {name: v_lead_true, sort: real}   # true velocity of directly leading vehicle [m/s]
    - {name: congestion, sort: bool}    # congestion present on the carriageway

system_contract:
  interface:
    inputs: [v_ego_true, v_lead_true, congestion]
    outputs: [v_cmd]
  assumption: "G(v_ego_true >= 0 and v_ego_true <= V_MAX and v_lead_true >= 0 and v_lead_true <= V_MAX and abs(v_cmd - v_ego_true) <= EPS_TRACK)"
  guarantee: "G((not congestion and v_lead_true >= V_CLEAR) -> v_ego_true >= V_STOP)"

decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0 and v_lead_true <= V_MAX)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_VL)"

    - service: Planning
      interface: {inputs: [v_lead, congestion], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_VL and v_lead <= V_MAX + EPS_VL)"
      guarantee: "G((not congestion and v_lead >= V_CLEAR - EPS_VL) -> v_cmd >= V_STOP + EPS_TRACK)"