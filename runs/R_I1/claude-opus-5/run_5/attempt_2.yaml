rule_id: R_I1_llm
description: >
  Prohibition of stopping on the main carriageway of an interstate
  (StVO §12(1) in conjunction with §18(8)). Stopping is only admissible if
  there is congestion or if the directly leading vehicle itself is
  stationary. Feature-level reading: whenever no congestion is present and
  the true velocity of the directly leading vehicle is clearly above the
  standstill threshold V_STAND = 0.5 m/s, the ego vehicle must keep moving,
  i.e. its true velocity must stay at or above V_STAND. Perception
  estimates the lead velocity with a bounded error EPS_VL = 0.5 m/s, so the
  Planning trigger threshold on the estimated lead velocity must be lowered
  by that bound; the plant tracks the commanded velocity within
  EPS_TRACK = 1.0 m/s, so the commanded velocity must be raised by that
  bound above the standstill threshold. Localization is added to the
  decomposition because Control reads the estimated ego velocity, and
  Planning additionally guarantees a non-negative velocity command, which
  together discharge the Control assumption.
source_text: >
  StVO §12(1): "Das Halten ist unzulaessig ... " in Verbindung mit
  StVO §18(8): "Auf Autobahnen und Kraftfahrstrassen ist das Halten, auch
  auf Seitenstreifen, verboten." Ausnahme: Stillstand infolge Stockung des
  Verkehrs (Stau) oder weil das unmittelbar vorausfahrende Fahrzeug steht.
sampling_rate_hz: 10
horizon: 10

constants:
  V_STAND: 0.5      # standstill threshold [m/s]
  V_CLEAR: 2.0      # "clearly above standstill" lead velocity [m/s]
  EPS_VL: 0.5       # perception lead-velocity error bound [m/s]
  EPS_V: 0.5        # localization ego-velocity error bound [m/s]
  EPS_TRACK: 1.0    # plant velocity-tracking error bound [m/s]
  V_MAX: 70.0       # max considered velocity [m/s]

environment:
  signals:
    - {name: v_true, sort: real}        # true ego velocity [m/s]
    - {name: v_lead_true, sort: real}   # true velocity of directly leading vehicle [m/s]
    - {name: congestion, sort: bool}    # traffic congestion (Stau/Stockung) present

system_contract:
  interface:
    inputs: [v_true, v_lead_true, congestion]
    outputs: [v_ego, v_lead, v_cmd, gear_rev_cmd]
  assumption: "G(v_true >= 0 and v_true <= V_MAX and v_lead_true >= 0 and v_lead_true <= V_MAX and abs(v_true - v_cmd) <= EPS_TRACK)"
  guarantee: "G((not congestion and v_lead_true >= V_CLEAR) -> v_true >= V_STAND)"

decomposition:
  discharge_order: [Localization, Perception, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Perception
      interface: {inputs: [v_lead_true], outputs: [v_lead]}
      assumption: "G(v_lead_true >= 0 and v_lead_true <= V_MAX)"
      guarantee: "G(abs(v_lead - v_lead_true) <= EPS_VL)"

    - service: Planning
      interface: {inputs: [v_lead], outputs: [v_cmd]}
      assumption: "G(v_lead >= 0 - EPS_VL and v_lead <= V_MAX + EPS_VL)"
      guarantee: "G(v_cmd >= 0 and ((v_lead >= V_CLEAR - EPS_VL) -> v_cmd >= V_STAND + EPS_TRACK))"

    - service: Control
      interface: {inputs: [v_cmd, v_ego], outputs: [gear_rev_cmd]}
      assumption: "G(v_cmd >= 0 and v_ego >= 0 - EPS_V)"
      guarantee: "G((v_cmd >= V_STAND + EPS_TRACK) -> not gear_rev_cmd)"