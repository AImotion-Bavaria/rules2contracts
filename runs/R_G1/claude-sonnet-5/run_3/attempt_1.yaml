rule_id: R_G1_llm
description: >
  Safe following distance to a preceding vehicle (StVO §4(1)), time-gap
  interpretation: whenever the true gap to the lead vehicle falls below
  1.8 s times the true ego velocity, a hazard notification must be raised
  within 300 ms (3 steps at 10 Hz). Perception estimates the gap with a
  bounded error and Localization estimates the ego velocity with a
  bounded error, so the Planning trigger threshold must be tightened to
  compensate for both estimation errors.
source_text: >
  StVO §4(1): "Der Abstand zu einem vorausfahrenden Fahrzeug muss in der
  Regel so groß sein, dass auch dann hinter ihm gehalten werden kann,
  wenn es plötzlich gebremst wird."
sampling_rate_hz: 10
horizon: 6

constants:
  TAU: 1.8       # required time gap [s]
  EPS_D: 2.0     # perception longitudinal-gap error bound [m]
  EPS_V: 0.5     # localization velocity error bound [m/s]
  D_MAX: 200.0   # max considered true gap [m]
  V_MAX: 70.0    # max considered true velocity [m/s]
  MARGIN: 2.9    # TAU*EPS_V + EPS_D, compensation margin on d_lead threshold

environment:
  signals:
    - {name: gap_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: v_true, sort: real}     # true ego velocity [m/s]

system_contract:
  interface: {inputs: [gap_true, v_true], outputs: [hazard_on]}
  assumption: "G(gap_true >= 0 and gap_true <= D_MAX and v_true >= 0 and v_true <= V_MAX)"
  guarantee: "G((gap_true < TAU * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Perception, Localization, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [gap_true], outputs: [d_lead]}
      assumption: "G(gap_true >= 0 and gap_true <= D_MAX)"
      guarantee: "G(abs(d_lead - gap_true) <= EPS_D)"

    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [d_lead, v_ego], outputs: [hazard_on]}
      assumption: "G(d_lead >= 0 and d_lead <= D_MAX + EPS_D and v_ego >= 0 - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G((d_lead < TAU * v_ego + MARGIN) -> F[0,3](hazard_on))"
