rule_id: R_G1_llm
description: >
  Safe distance to a preceding vehicle (StVO §4(1)), time-gap
  interpretation: whenever the true longitudinal gap to the lead vehicle
  falls below 1.8 s times the true ego velocity, a hazard notification
  must be raised within 300 ms (3 steps at 10 Hz). Perception estimates
  the gap with a bounded error and Localization estimates the ego
  velocity with a bounded error, so the Planning trigger threshold must
  be loosened (increased) by the combined error contribution to remain
  sound with respect to the true-quantity requirement.
source_text: >
  "Der Abstand zu einem vorausfahrenden Fahrzeug muss in der Regel so
  groß sein, dass auch dann hinter ihm gehalten werden kann, wenn es
  plötzlich gebremst wird." (StVO §4(1))
sampling_rate_hz: 10
horizon: 6

constants:
  T_GAP: 1.8      # required time gap [s]
  EPS_D: 2.0      # perception gap estimation error bound [m]
  EPS_V: 0.5      # localization velocity estimation error bound [m/s]
  MARGIN: 2.9     # = T_GAP*EPS_V + EPS_D, compensation margin [m]
  D_MAX: 250.0    # max considered gap [m]
  V_MAX: 70.0     # max considered velocity [m/s]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: v_true, sort: real}   # true ego velocity [m/s]

system_contract:
  interface: {inputs: [d_true, v_true], outputs: [hazard_on]}
  assumption: "G(d_true >= 0 and d_true <= D_MAX and v_true >= 0 and v_true <= V_MAX)"
  guarantee: "G((d_true < T_GAP * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Perception, Localization, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0 and d_true <= D_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [d_lead, v_ego], outputs: [hazard_on]}
      assumption: "G(d_lead >= 0 - EPS_D and v_ego >= 0 - EPS_V)"
      guarantee: "G((d_lead < T_GAP * v_ego + MARGIN) -> F[0,3](hazard_on))"
