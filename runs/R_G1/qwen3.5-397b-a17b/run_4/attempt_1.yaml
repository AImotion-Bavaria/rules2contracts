rule_id: R_G1_llm
description: >
  Safe distance to the preceding vehicle (StVO §4(1)): Time-gap interpretation
  requiring hazard notification if true gap falls below 1.8 s times true ego
  velocity. Hazard must be raised within 300 ms.
source_text: >
  StVO §4(1): 'Der Abstand zu einem vorausfahrenden Fahrzeug muss in der Regel
  so groß sein, dass auch dann hinter ihm gehalten werden kann, wenn es plötzlich
  gebremst wird.' Interpretation: Hazard within 300 ms (3 steps at 10 Hz) if
  d_true < 1.8 * v_true.
sampling_rate_hz: 10
horizon: 8

constants:
  TG: 1.8         # Time gap threshold [s]
  EPS_D: 2.0      # Perception gap error bound [m]
  EPS_V: 0.5      # Localization velocity error bound [m/s]
  MARGIN: 2.9     # Compensation margin: EPS_D + TG * EPS_V

environment:
  signals:
    - {name: d_true, sort: real}
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [d_true, v_true], outputs: [hazard_on]}
  assumption: "G(v_true >= 0 and d_true >= 0)"
  guarantee: "G((d_true < TG * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [v_ego, d_lead], outputs: [hazard_on]}
      assumption: "G(v_ego >= -EPS_V and d_lead >= -EPS_D)"
      guarantee: "G((d_lead < TG * v_ego + MARGIN) -> F[0,3](hazard_on))"