rule_id: R_G1_llm
description: >
  Safe distance to the preceding vehicle (StVO §4(1)): The distance to a preceding vehicle must generally be large enough to allow stopping behind it even if it brakes suddenly. Formalized via a time-gap interpretation: if the true gap falls below 1.8 s times the true ego velocity, a hazard notification must be raised within 300 ms.
source_text: >
  StVO §4(1): 'Der Abstand zu einem vorausfahrenden Fahrzeug muss in der Regel so groß sein, dass auch dann hinter ihm gehalten werden kann, wenn es plötzlich gebremst wird.'
sampling_rate_hz: 10
horizon: 8
constants:
  T_GAP: 1.8
  EPS_V: 0.5
  EPS_D: 2.0
  MARGIN: 2.9
  V_MAX: 70.0
  D_MAX: 500.0
environment:
  signals:
    - {name: v_true, sort: real}
    - {name: d_true, sort: real}
system_contract:
  interface: {inputs: [v_true, d_true], outputs: [hazard_on]}
  assumption: "G(v_true >= 0 and v_true <= V_MAX and d_true >= 0 and d_true <= D_MAX)"
  guarantee: "G((d_true < T_GAP * v_true) -> F[0,3](hazard_on))"
decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0 and d_true <= D_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"
    - service: Planning
      interface: {inputs: [v_ego, d_lead], outputs: [hazard_on]}
      assumption: "G(v_ego >= 0 and d_lead >= 0)"
      guarantee: "G((d_lead < T_GAP * v_ego + MARGIN) -> F[0,3](hazard_on))"