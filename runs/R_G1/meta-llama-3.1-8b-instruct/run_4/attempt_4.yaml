rule_id: R_G1_llm
description: >
  Safe distance to the preceding vehicle (StVO §4(1)): the gap to the
  preceding vehicle must be such that it can be maintained even if the
  preceding vehicle brakes suddenly.
source_text: >
  StVO §4(1): "Der Abstand zu einem vorausfahrenden Fahrzeug muss in der
  Regel so groß sein, dass auch dann hinter ihm gehalten werden kann, wenn
  es plötzlich gebremst wird."
sampling_rate_hz: 10
horizon: 6

constants:
  T_MIN: 1.8  # minimum time gap [s]
  EPS_G: 2.0  # perception gap error bound [m]
  EPS_V: 0.5  # localization velocity error bound [m/s]

environment:
  signals:
    - {name: d_lead, sort: real}   # true gap to the preceding vehicle [m]
    - {name: v_true, sort: real}   # true ego velocity [m/s]

system_contract:
  interface: {inputs: [d_lead, v_true], outputs: [hazard_on]}
  assumption: "G(d_lead >= 0 and v_true >= 0)"
  guarantee: "G(F[0,3]((d_lead / v_true < T_MIN) -> F[0,3](hazard_on)))"

decomposition:
  discharge_order: [Perception, Localization]
  contracts:
    - service: Perception
      interface: {inputs: [], outputs: [d_lead]}
      assumption: "G(true)"
      guarantee: "G(abs(d_lead - d_lead_true) <= EPS_G)"

    - service: Localization
      interface: {inputs: [], outputs: [v_true]}
      assumption: "G(true)"
      guarantee: "G(abs(v_true - v_ego) <= EPS_V)"

    - service: Hazard_Notification
      interface: {inputs: [d_lead, v_true], outputs: [hazard_on]}
      assumption: "G(d_lead >= 0 and v_true >= 0)"
      guarantee: "G(F[0,3]((d_lead / v_true < T_MIN) -> F[0,3](hazard_on)))"