rule_id: R_G1_llm
description: >
  Safe distance to the preceding vehicle (StVO §4(1)): the gap to the
  vehicle ahead must be large enough to keep a safe following distance
  even if the lead vehicle brakes suddenly. Using the time‑gap rule,
  whenever the true gap falls below 1.8 s × true ego speed, a hazard
  notification must be raised within 300 ms (3 steps at 10 Hz).
source_text: >
  StVO §4(1) – “Der Abstand zu einem vorausfahrenden Fahrzeug muss in der
  Regel so groß sein, dass auch dann hinter ihm gehalten werden kann, wenn
  es plötzlich gebremst wird.”  Interpreted as a time‑gap of 1.8 s with a
  300 ms reaction deadline.
sampling_rate_hz: 10
horizon: 8

constants:
  TIME_GAP: 1.8          # time‑gap [s]
  EPS_D: 2.0             # perception gap error bound [m]
  EPS_V: 0.5             # localization velocity error bound [m/s]

environment:
  signals:
    - {name: true_gap, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: v_true, sort: real}    # true ego velocity [m/s]

system_contract:
  interface: {inputs: [true_gap, v_true], outputs: [hazard_on]}
  assumption: "G(v_true >= 0 and true_gap >= 0)"
  guarantee: "G((true_gap < TIME_GAP * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Perception
      interface: {inputs: [true_gap], outputs: [d_lead]}
      assumption: "G(true_gap >= 0)"
      guarantee: "G(abs(d_lead - true_gap) <= EPS_D)"

    - service: Planning
      interface: {inputs: [v_ego, d_lead], outputs: [hazard_on]}
      assumption: "G(v_ego >= -EPS_V and d_lead >= -EPS_D)"
      guarantee: "G((d_lead < TIME_GAP * v_ego + (TIME_GAP * EPS_V + EPS_D)) -> F[0,3](hazard_on))"
