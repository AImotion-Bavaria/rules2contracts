rule_id: R_G1_llm
description: >
  Safe distance to preceding vehicle (StVO §4(1)): The distance to a preceding vehicle must be such that the ego vehicle can stop behind it even if it brakes suddenly. Time-gap interpretation: if the true gap falls below 1.8 s * true ego velocity, a hazard notification must be raised within 300 ms.
source_text: >
  StVO §4(1): "Der Abstand zu einem vorausfahrenden Fahrzeug muss in der Regel so groß sein, dass auch dann hinter ihm gehalten werden kann, wenn es plötzlich gebremst wird."
sampling_rate_hz: 10
horizon: 8

constants:
  T_GAP: 1.8
  EPS_D: 2.0
  EPS_V: 0.5
  V_MAX: 70.0

environment:
  signals:
    - {name: d_true, sort: real}
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [d_true, v_true], outputs: [hazard_on]}
  assumption: "G(d_true >= 0 and v_true >= 0 and v_true <= V_MAX)"
  guarantee: "G((d_true < T_GAP * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(v_ego >= 0 and abs(v_ego - v_true) <= EPS_V)"

    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(d_lead >= 0 and abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [v_ego, d_lead], outputs: [hazard_on]}
      assumption: "G(v_ego >= 0 and v_ego <= V_MAX + EPS_V and d_lead >= 0)"
      guarantee: "G((d_lead + EPS_D < T_GAP * (v_ego - EPS_V)) -> F[0,3](hazard_on))"