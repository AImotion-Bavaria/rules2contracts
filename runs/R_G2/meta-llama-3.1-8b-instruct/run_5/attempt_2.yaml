rule_id: R_G2_llm
description: Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason.
source_text: StVO §4(1)
sampling_rate_hz: 10
horizon: 8

constants:
  a_cmd_max: 2.0  # max permitted deceleration [m/s^2]
  d_min: 20.0     # min permitted gap to preceding vehicle [m]
  EPS_D: 2.0      # perception gap error bound [m]
  EPS_A: 0.5      # plant acceleration tracking error bound [m/s^2]
  V_MAX: 100.0    # max considered velocity [m/s]

environment:
  signals:
    - {name: d_true, sort: real}   # true gap to preceding vehicle [m]
    - {name: a_true, sort: real}   # true deceleration [m/s^2]
    - {name: v_ego, sort: real}    # true ego velocity [m/s]

system_contract:
  interface: {inputs: [d_true, a_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0 and d_true <= V_MAX and a_true >= -10.0 and a_true <= 10.0 and v_ego >= 0 and v_ego <= V_MAX)"
  guarantee: "G((a_true >= a_cmd_max) -> F[0,2](d_true < d_min))"

decomposition:
  discharge_order: [Perception, Control]
  contracts:
    - service: Perception
      interface: {inputs: [], outputs: [d_lead]}
      assumption: "G(d_true >= 0 and d_true <= V_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Control
      interface: {inputs: [d_lead], outputs: [a_cmd]}
      assumption: "G(d_lead >= 0 - EPS_D)"
      guarantee: "G((a_cmd - a_true >= a_cmd_max - EPS_A) -> F[0,2](d_true < d_min))"