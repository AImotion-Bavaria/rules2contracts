rule_id: R_G2_llm
description: >
  Prohibition of unnecessary abrupt braking (StVO §4(1)). Feature-level
  interpretation: the vehicle may realise a deceleration stronger than
  A_BRAKE = 2.0 m/s^2 only if the true longitudinal gap to the preceding
  vehicle is critical, i.e. at most D_CRIT = 20.0 m. Perception estimates
  the gap with error bound EPS_D = 2.0 m, so the Planning trigger gap must
  be tightened to D_CRIT - EPS_D = 18.0 m. The plant tracks the commanded
  acceleration within EPS_A = 0.5 m/s^2, so the command-level braking
  threshold must be relaxed (made less negative) to
  -(A_BRAKE - EPS_A) = -1.5 m/s^2, guaranteeing that the realised
  deceleration never falls below -2.0 m/s^2 without a critical gap.
source_text: >
  StVO §4 Abs. 1 Satz 2: "Wer vorausfährt, darf nicht ohne zwingenden
  Grund stark bremsen." (A driver ahead must not brake abruptly without
  compelling reason.)
sampling_rate_hz: 10
horizon: 10

constants:
  A_BRAKE: 2.0      # abrupt-braking magnitude threshold [m/s^2]
  D_CRIT: 20.0      # critical (compelling-reason) gap [m]
  EPS_D: 2.0        # perception gap error bound [m]
  EPS_A: 0.5        # plant acceleration tracking error bound [m/s^2]
  D_MAX: 300.0      # max considered gap [m]
  V_MAX: 70.0       # max considered velocity [m/s]
  A_DEC_MAX: 10.0   # max magnitude of any planned/commanded acceleration [m/s^2]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: v_true, sort: real}   # true ego velocity [m/s]
    - {name: a_true, sort: real}   # true (realised) ego longitudinal acceleration [m/s^2]

system_contract:
  interface: {inputs: [d_true, v_true, a_true], outputs: [d_lead, a_plan, a_cmd]}
  assumption: "G(d_true >= 0 and d_true <= D_MAX and v_true >= 0 and v_true <= V_MAX and abs(a_true - a_cmd) <= EPS_A)"
  guarantee: "G((a_true <= 0 - A_BRAKE) -> d_true <= D_CRIT)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true, v_true], outputs: [d_lead, v_lead]}
      assumption: "G(d_true >= 0 and d_true <= D_MAX and v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead, v_lead, v_ego, a_ego], outputs: [a_plan, v_cmd]}
      assumption: "G(d_lead >= 0 - EPS_D and d_lead <= D_MAX + EPS_D)"
      guarantee: "G((a_plan <= 0 - A_BRAKE + EPS_A) -> d_lead <= D_CRIT - EPS_D)"

    - service: Control
      interface: {inputs: [a_plan, v_cmd, v_ego], outputs: [a_cmd, gear_rev_cmd]}
      assumption: "G(a_plan >= 0 - A_DEC_MAX and a_plan <= A_DEC_MAX)"
      guarantee: "G((a_cmd <= 0 - A_BRAKE + EPS_A) -> a_plan <= 0 - A_BRAKE + EPS_A)"