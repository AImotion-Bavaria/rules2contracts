rule_id: R_G2_llm
description: >
  Unnecessary abrupt braking (StVO §4(1)). No strong deceleration without
  reason: a true longitudinal deceleration stronger than A_BRAKE = 2.0 m/s^2
  is only admissible when the true gap to the preceding vehicle is critical
  (at or below D_CRIT = 20.0 m). Perception estimates the gap with error
  bound EPS_D = 2.0 m and the plant tracks the commanded acceleration within
  EPS_A = 0.5 m/s^2, so the Planning trigger condition on the estimated gap
  must be tightened by EPS_D and the acceleration threshold relaxed by EPS_A.
source_text: >
  StVO §4 Abs. 1 Satz 2: "Wer vorausfährt, darf nicht ohne zwingenden Grund
  stark bremsen." (A driver ahead must not brake abruptly without compelling
  reason.) Feature-level interpretation: commanded/realised deceleration
  stronger than 2.0 m/s^2 is permitted only if the gap to the preceding
  vehicle is below 20.0 m.
sampling_rate_hz: 10
horizon: 10

constants:
  A_BRAKE: 2.0    # abrupt-braking threshold on deceleration [m/s^2]
  D_CRIT: 20.0    # critical gap to preceding vehicle [m]
  EPS_D: 2.0      # perception gap error bound [m]
  EPS_A: 0.5      # plant acceleration tracking error bound [m/s^2]
  A_MAX: 10.0     # max considered acceleration magnitude [m/s^2]
  D_MAX: 200.0    # max considered gap [m]
  V_MAX: 70.0     # max considered velocity [m/s]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to preceding vehicle [m]
    - {name: a_true, sort: real}   # true ego longitudinal acceleration [m/s^2]
    - {name: v_true, sort: real}   # true ego velocity [m/s]

system_contract:
  interface: {inputs: [d_true, a_true, v_true], outputs: [d_lead, a_plan, a_cmd]}
  assumption: >
    G(d_true >= 0 and d_true <= D_MAX and v_true >= 0 and v_true <= V_MAX
      and a_true >= 0 - A_MAX and a_true <= A_MAX
      and abs(a_true - a_cmd) <= EPS_A)
  guarantee: "G((a_true <= 0 - A_BRAKE) -> (d_true <= D_CRIT))"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0 and d_true <= D_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= 0 - EPS_D and d_lead <= D_MAX + EPS_D)"
      guarantee: "G((a_plan <= 0 - A_BRAKE + EPS_A) -> (d_lead <= D_CRIT - EPS_D))"

    - service: Control
      interface: {inputs: [a_plan, v_ego], outputs: [a_cmd]}
      assumption: "G(a_plan >= 0 - A_MAX and a_plan <= A_MAX and v_ego >= 0 - EPS_A)"
      guarantee: "G(a_cmd >= a_plan)"