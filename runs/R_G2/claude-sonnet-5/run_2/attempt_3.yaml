rule_id: R_G2_llm
description: >
  Unnecessary braking (StVO §4(1)): a vehicle must not brake abruptly
  without reason. Formalized at feature level: a commanded deceleration
  stronger than 2.0 m/s^2 is only permitted when the true longitudinal
  gap to the preceding vehicle is critical (below 20.0 m). Perception
  estimates the gap with a bounded error, and the plant tracks the
  commanded acceleration within a bounded tracking error, so both the
  gap threshold and the deceleration threshold used internally must be
  tightened by these bounds. Planning's commanded acceleration is also
  bounded in magnitude so that Control's tracking assumption is always
  satisfied.
source_text: >
  StVO §4(1): "Der Kraftfahrzeugführer darf nicht stärker bremsen, als es
  ... erforderlich ist. Er darf nur aus zwingendem Grund scharf bremsen."
  (A vehicle must not brake more sharply than necessary; sharp braking is
  only permitted for a compelling reason.)

sampling_rate_hz: 10
horizon: 4

constants:
  A_THRESH: 2.0    # deceleration magnitude considered "abrupt" [m/s^2]
  D_CRIT: 20.0     # critical gap below which abrupt braking is justified [m]
  EPS_D: 2.0       # perception gap estimation error bound [m]
  EPS_A: 0.5       # plant acceleration tracking error bound [m/s^2]
  D_MAX: 200.0     # max plausible gap considered [m]
  A_PLAN_MAX: 20.0 # max plausible commanded acceleration magnitude [m/s^2]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]

system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0 and d_true <= D_MAX)"
  guarantee: "G((a_cmd <= 0 - A_THRESH) -> d_true <= D_CRIT)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0 and d_true <= D_MAX)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= 0 - EPS_D and d_lead <= D_MAX + EPS_D)"
      guarantee: >
        G((a_plan >= 0 - A_PLAN_MAX and a_plan <= A_PLAN_MAX) and
          ((a_plan <= 0 - (A_THRESH - EPS_A)) -> d_lead <= D_CRIT - EPS_D))

    - service: Control
      interface: {inputs: [a_plan], outputs: [a_cmd]}
      assumption: "G(a_plan >= 0 - A_PLAN_MAX and a_plan <= A_PLAN_MAX)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"
