rule_id: R_G2_llm
description: >
  Unnecessary/abrupt braking (StVO §4(1)): a vehicle must not brake harder
  than a moderate threshold unless the gap to the preceding vehicle is
  critical. Interpreted at feature level: a commanded deceleration beyond
  2.0 m/s^2 is only permitted when the true gap to the lead vehicle is
  below 20.0 m. Perception's gap estimate carries a bounded error and the
  control plant tracks the commanded acceleration only approximately, so
  both the gap and the acceleration thresholds used internally must be
  tightened by these bounds to guarantee the system-level requirement on
  ground-truth quantities. Planning additionally guarantees that its
  commanded acceleration stays within the plant's admissible tracking
  range, so that Control's tracking assumption is always discharged.
source_text: >
  StVO §4 Abstand (1): "Der Kraftfahrzeugführer darf ... nicht so stark
  bremsen, dass dies ohne zwingenden Grund zu einer Gefährdung ... führt."
  (No abrupt braking without compelling reason; a critical gap to the
  preceding vehicle constitutes such a reason.)
sampling_rate_hz: 10
horizon: 4

constants:
  A_BRAKE: 2.0     # abrupt-braking threshold on commanded deceleration [m/s^2]
  D_CRIT: 20.0     # critical gap threshold [m]
  EPS_D: 2.0       # perception gap estimation error bound [m]
  EPS_A: 0.5       # plant acceleration tracking error bound [m/s^2]
  A_RANGE: 50.0    # admissible magnitude bound for planned acceleration [m/s^2]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]

system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G(a_cmd <= 0 - A_BRAKE -> d_true <= D_CRIT)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= 0 - EPS_D)"
      guarantee: >
        G((a_plan <= 0 - (A_BRAKE - EPS_A) -> d_lead <= D_CRIT - EPS_D)
          and a_plan >= 0 - A_RANGE and a_plan <= A_RANGE)

    - service: Control
      interface: {inputs: [a_plan], outputs: [a_cmd]}
      assumption: "G(a_plan >= 0 - A_RANGE and a_plan <= A_RANGE)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"
