rule_id: R_G2_llm
description: >
  Unnecessary braking prohibition (StVO §4(1)): A commanded deceleration
  stronger than 2.0 m/s² is only permitted when the gap to the preceding
  vehicle is critical (below 20.0 m). Perception estimates the gap with a
  bounded error of 2.0 m, and the plant tracks the commanded acceleration
  within 0.5 m/s².
source_text: >
  StVO §4(1): "Vehicles must not brake abruptly without reason."
  Interpretation: Commanded deceleration > 2.0 m/s² requires critical gap
  (d_lead_true < 20.0 m).
sampling_rate_hz: 10
horizon: 8

constants:
  A_THRESH: 2.0      # deceleration threshold [m/s²]
  D_CRITICAL: 20.0   # critical gap threshold [m]
  EPS_D: 2.0         # perception gap error bound [m]
  EPS_A: 0.5         # plant tracking error bound [m/s²]

environment:
  signals:
    - {name: d_lead_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: a_ego_true, sort: real}    # true ego acceleration [m/s²]

system_contract:
  interface: {inputs: [d_lead_true, a_ego_true], outputs: [a_cmd]}
  assumption: "G(d_lead_true >= 0 and a_ego_true >= -10.0 and a_ego_true <= 10.0)"
  guarantee: "G((a_cmd < -A_THRESH) -> (d_lead_true < D_CRITICAL))"

decomposition:
  discharge_order: [Perception, Localization, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_lead_true], outputs: [d_lead]}
      assumption: "G(d_lead_true >= 0)"
      guarantee: "G(abs(d_lead - d_lead_true) <= EPS_D)"

    - service: Localization
      interface: {inputs: [a_ego_true], outputs: [a_ego]}
      assumption: "G(a_ego_true >= -10.0 and a_ego_true <= 10.0)"
      guarantee: "G(abs(a_ego - a_ego_true) <= 0.0)"  # Assume perfect for simplicity; if error exists, adjust EPS_A

    - service: Planning
      interface: {inputs: [d_lead, v_ego, a_ego], outputs: [a_plan]}
      assumption: "G(d_lead >= 0 - EPS_D and v_ego >= 0 and a_ego >= -10.0 and a_ego <= 10.0)"
      guarantee: "G((a_plan < -A_THRESH - EPS_A) -> (d_lead < D_CRITICAL - EPS_D))"

    - service: Control
      interface: {inputs: [a_plan, v_ego], outputs: [a_cmd]}
      assumption: "G(a_plan >= -10.0 and a_plan <= 10.0 and v_ego >= 0)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"