rule_id: R_G2_llm
description: >-
  Unnecessary braking (StVO §4(1)): vehicles must not apply an abrupt
  deceleration stronger than 2.0 m/s² unless the gap to the preceding
  vehicle is critical (≤ 20 m). The rule is expressed as an assume/guarantee
  contract over the estimated gap (d_lead) and commanded deceleration
  (a_cmd), accounting for perception error (±2 m) and actuation tracking
  error (±0.5 m/s²).
source_text: >-
  StVO §4(1): “Fahrzeuge dürfen nicht ohne Grund abrupt bremsen.”  Interpreted
  as “a commanded deceleration > 2.0 m/s² is allowed only when the gap to the
  preceding vehicle is below 20 m.”
sampling_rate_hz: 10
horizon: 8

constants:
  DECEL_THRESH: 2.0
  GAP_CRIT: 20.0
  EPS_D: 2.0
  EPS_A: 0.5

environment:
  signals:
    - {name: d_true, sort: real}
    - {name: a_true, sort: real}

system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G((a_cmd < -DECEL_THRESH) -> (d_true <= GAP_CRIT))"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"
    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= -EPS_D)"
      guarantee: "G((a_plan < -(DECEL_THRESH - EPS_A)) -> (d_lead <= GAP_CRIT - EPS_D))"
    - service: Control
      interface: {inputs: [a_plan], outputs: [a_cmd]}
      assumption: "G(1 >= 0)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"