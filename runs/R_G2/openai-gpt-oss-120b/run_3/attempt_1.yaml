rule_id: R_G2_llm
description: >
  Unnecessary braking (StVO §4(1)): a commanded deceleration stronger than
  2.0 m/s² is only allowed when the true gap to the preceding vehicle is
  critical (below 20.0 m). Perception estimates the gap with a bounded error
  of 2.0 m and the plant tracks the commanded acceleration within 0.5 m/s²,
  so the planning threshold is tightened accordingly.
source_text: >
  StVO §4(1) – “Fahrzeuge dürfen nicht ohne Grund abrupt bremsen.”  Interpreted
  at feature level: a commanded deceleration stronger than 2.0 m/s² is only
  permitted when the gap to the preceding vehicle is below 20.0 m.  The
  perception module estimates the gap with an error bound of 2.0 m, and the
  vehicle plant tracks the commanded acceleration within 0.5 m/s².
sampling_rate_hz: 10
horizon: 8

constants:
  A_DEC: 2.0        # deceleration threshold [m/s²] (negative direction)
  GAP_CRIT: 20.0    # critical gap [m]
  EPS_D: 2.0        # perception gap error bound [m]
  EPS_A: 0.5        # plant acceleration tracking error bound [m/s²]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: a_true, sort: real}   # true longitudinal acceleration of ego vehicle [m/s²]

system_contract:
  interface: {inputs: [d_true, a_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G((a_cmd <= -A_DEC) -> d_true < GAP_CRIT)"

decomposition:
  discharge_order: [Perception, Control, Plant]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Control
      interface: {inputs: [d_lead], outputs: [a_cmd]}
      assumption: "G(d_lead >= 0)"
      guarantee: "G((a_cmd <= -A_DEC) -> d_lead < GAP_CRIT - EPS_D)"

    - service: Plant
      interface: {inputs: [a_cmd], outputs: [a_true]}
      assumption: "G(a_cmd >= -10 and a_cmd <= 10)"
      guarantee: "G(abs(a_true - a_cmd) <= EPS_A)"