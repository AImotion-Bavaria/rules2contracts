rule_id: R_G2_llm
description: >-
  Unnecessary braking (StVO §4(1)): a commanded deceleration stronger than
  2.0 m/s² is only permitted when the gap to the preceding vehicle is critical
  (≤ 20 m). Perception estimates the gap with a bounded error of 2.0 m and the
  plant tracks the commanded acceleration within 0.5 m/s², so the thresholds
  are tightened accordingly.
source_text: >-
  StVO §4(1): "Fahrzeuge dürfen nicht ohne Grund abrupt bremsen." Interpreted as
  "a commanded deceleration > 2.0 m/s² may only be applied if the gap to the
  preceding vehicle is ≤ 20 m."
sampling_rate_hz: 10
horizon: 8

constants:
  A_BRK: 2.0        # deceleration threshold [m/s^2]
  GAP_CRIT: 20.0    # critical gap [m]
  EPS_D: 2.0        # perception gap error bound [m]
  EPS_A: 0.5        # acceleration tracking error bound [m/s^2]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]
    - {name: a_true, sort: real}   # true longitudinal acceleration of ego vehicle [m/s^2]

system_contract:
  interface: {inputs: [d_true, a_true], outputs: [a_cmd, d_lead]}
  assumption: "G(d_true >= 0 and a_true <= 0)"
  guarantee: "G((a_cmd <= -A_BRK - EPS_A) -> d_lead <= GAP_CRIT - EPS_D)"

decomposition:
  discharge_order: [Perception, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"
    - service: Control
      interface: {inputs: [a_true], outputs: [a_cmd]}
      assumption: "G(a_true <= 0)"
      guarantee: "G(abs(a_cmd - a_true) <= EPS_A)"