rule_id: R_G2_llm
description: >
  Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason.
  Interpret at feature level: a commanded deceleration stronger than 2.0 m/s^2 is only
  permitted when the gap to the preceding vehicle is critical (below 20.0 m).
source_text: >
  StVO §4(1): "Das Fahrzeug darf nur so stark gebremst werden, wie es zur Vermeidung
  einer Gefahr erforderlich ist." (Vehicles must not brake more strongly than necessary
  to avoid danger.)
sampling_rate_hz: 10
horizon: 4

constants:
  A_THRESH: 2.0   # deceleration threshold [m/s^2]
  D_THRESH: 20.0  # critical gap threshold [m]
  EPS_D: 2.0      # perception gap error bound [m]
  EPS_A: 0.5      # plant tracking error bound [m/s^2]

environment:
  signals:
    - {name: d_true, sort: real}   # true longitudinal gap to lead vehicle [m]

system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G(a_cmd < -A_THRESH -> d_true < D_THRESH)"

decomposition:
  discharge_order: [Perception, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Control
      interface: {inputs: [d_lead], outputs: [a_cmd]}
      assumption: "G(d_lead >= 0 - EPS_D)"
      guarantee: "G(a_cmd < -A_THRESH -> d_lead < D_THRESH - EPS_D)"