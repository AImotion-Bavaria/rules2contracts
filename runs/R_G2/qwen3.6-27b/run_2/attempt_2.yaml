rule_id: R_G2_llm
description: >
  Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason.
  Interpreted at feature level: a commanded deceleration stronger than 2.0 m/s^2 is only
  permitted when the gap to the preceding vehicle is critical (below 20.0 m).
source_text: >
  StVO §4(1): "Das Fahrzeug darf nur so stark gebremst werden, wie es zur Vermeidung
  einer Gefahr erforderlich ist." (Interpretation: abrupt braking without reason prohibited.)
sampling_rate_hz: 10
horizon: 8

constants:
  D_CRIT: 20.0
  A_BRAKE_THRESH: 2.0
  EPS_D: 2.0
  EPS_A: 0.5

environment:
  signals:
    - {name: d_true, sort: real}

system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G(d_true >= D_CRIT -> a_cmd >= -A_BRAKE_THRESH)"

decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= -EPS_D)"
      guarantee: "G(d_lead >= D_CRIT - EPS_D -> a_plan >= -A_BRAKE_THRESH + EPS_A)"

    - service: Control
      interface: {inputs: [a_plan], outputs: [a_cmd]}
      assumption: "G(0 <= 0)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"