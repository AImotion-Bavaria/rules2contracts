rule_id: R_G2_llm
description: >
  Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason.
  Interpret at feature level: a commanded deceleration stronger than 2.0 m/s^2 is only
  permitted when the gap to the preceding vehicle is critical (below 20.0 m).
source_text: >
  StVO §4(1): "Fahrzeuge dürfen nicht ohne Grund abrupt bremsen."
  Feature-level interpretation: Commanded deceleration > 2.0 m/s^2 requires gap < 20.0 m.
sampling_rate_hz: 10
horizon: 8
constants:
  DECEL_THRESH: 2.0
  D_GAP_THRESH: 20.0
  EPS_D: 2.0
  EPS_A: 0.5
environment:
  signals:
    - {name: d_true, sort: real}
system_contract:
  interface: {inputs: [d_true], outputs: [a_cmd]}
  assumption: "G(d_true >= 0)"
  guarantee: "G(a_cmd <= -DECEL_THRESH -> d_true < D_GAP_THRESH)"
decomposition:
  discharge_order: [Perception, Planning, Control]
  contracts:
    - service: Perception
      interface: {inputs: [d_true], outputs: [d_lead]}
      assumption: "G(d_true >= 0)"
      guarantee: "G(abs(d_lead - d_true) <= EPS_D)"
    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= -EPS_D)"
      guarantee: "G(a_plan <= -(DECEL_THRESH - EPS_A) -> d_lead < D_GAP_THRESH - EPS_D)"
    - service: Control
      interface: {inputs: [a_plan], outputs: [a_cmd]}
      assumption: "G(true)"
      guarantee: "G(abs(a_cmd - a_plan) <= EPS_A)"