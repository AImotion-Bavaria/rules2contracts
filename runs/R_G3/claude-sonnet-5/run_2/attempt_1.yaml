rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1) general speed adaptation duty and §18
  motorway/limited-access speed limits): the vehicle must never travel
  faster than the speed limit that applies to its current lane. The
  commanded velocity issued by Planning must therefore stay below the
  lane limit by a margin that compensates the plant's velocity-tracking
  error, so that the true (ground-truth) ego velocity never exceeds the
  limit.
source_text: >
  StVO §3(1): "Wer ein Fahrzeug führt, darf nur so schnell fahren, dass
  das Fahrzeug ständig beherrscht wird ... Die gefahrene Geschwindigkeit
  ist stets den ... Umständen anzupassen." StVO §18: numerische
  Geschwindigkeitsbeschränkungen auf Autobahnen und Kraftfahrstraßen sind
  einzuhalten.
sampling_rate_hz: 10
horizon: 1

constants:
  V_TRACK: 1.0   # plant velocity-tracking error bound: |v_true - v_cmd| <= V_TRACK [m/s]
  V_MAX: 40.0    # max plausible lane speed limit considered [m/s]

environment:
  signals:
    - {name: v_limit, sort: real}   # true speed limit of the current lane [m/s]
    - {name: v_true, sort: real}    # true (ground-truth) ego velocity [m/s]

system_contract:
  interface: {inputs: [v_limit, v_true], outputs: [v_cmd]}
  assumption: "G(v_limit >= 0 and v_limit <= V_MAX and v_true >= 0 and abs(v_true - v_cmd) <= V_TRACK)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Planning]
  contracts:
    - service: Planning
      interface: {inputs: [v_limit], outputs: [v_cmd]}
      assumption: "G(v_limit >= 0 and v_limit <= V_MAX)"
      guarantee: "G(v_cmd <= v_limit - V_TRACK)"