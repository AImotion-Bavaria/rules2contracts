rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1) in conjunction with §18): a vehicle must
  never exceed the speed limit that applies to the lane it currently
  occupies. The commanded velocity is realized by the plant only up to a
  bounded tracking error, so the planned/commanded velocity must be kept
  below the lane limit by at least that tracking-error margin.
source_text: >
  StVO §3(1): "Wer ein Fahrzeug führt, darf nur so schnell fahren, dass er
  es ständig beherrscht... Die Geschwindigkeit ist insbesondere den
  Straßen-, Verkehrs-, Sicht- und Wetterverhältnissen sowie den
  persönlichen Fähigkeiten anzupassen." StVO §18 (Höchstgeschwindigkeiten,
  streckenbezogen durch Verkehrszeichen): die zulässige
  Höchstgeschwindigkeit der aktuellen Fahrspur darf nicht überschritten
  werden.

sampling_rate_hz: 10
horizon: 1

constants:
  TRACK_ERR: 1.0   # plant tracking error bound: |v_true - v_cmd| <= TRACK_ERR [m/s]
  V_MAX: 70.0      # maximum plausible speed considered [m/s]

environment:
  signals:
    - {name: v_true, sort: real}    # true (ground-truth) ego velocity [m/s]
    - {name: v_limit, sort: real}   # true lane speed limit [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd]}
  assumption: >
    G(v_true >= 0 and v_true <= V_MAX and
      v_limit >= 0 and v_limit <= V_MAX and
      abs(v_true - v_cmd) <= TRACK_ERR)
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Planning]
  contracts:
    - service: Planning
      interface: {inputs: [v_limit], outputs: [v_cmd]}
      assumption: "G(v_limit >= 0 and v_limit <= V_MAX)"
      guarantee: "G(v_cmd <= v_limit - TRACK_ERR)"
