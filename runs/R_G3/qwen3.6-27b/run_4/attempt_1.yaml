rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): vehicles must not drive faster than
  the speed limit of their current lane. The plant tracks the commanded
  velocity with a bounded error, so the Planning velocity command must be
  tightened by the tracking error bound to guarantee true velocity compliance.
source_text: >
  StVO §3(1)/§18: "Fahrzeuge dürfen nicht schneller fahren als die zulässige
  Höchstgeschwindigkeit der befahrenen Fahrbahn."
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_TRACK: 1.0   # plant velocity tracking error bound [m/s]
  EPS_LOC: 0.5     # localization velocity estimation error bound [m/s]

environment:
  signals:
    - {name: v_lim, sort: real}   # lane speed limit [m/s]
    - {name: v_true, sort: real}  # true ego velocity [m/s]

system_contract:
  interface: {inputs: [v_lim, v_true], outputs: [v_cmd]}
  assumption: "G(v_lim >= 0 and v_true >= 0 and abs(v_true - v_cmd) <= EPS_TRACK)"
  guarantee: "G(v_true <= v_lim)"

decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_LOC)"

    - service: Planning
      interface: {inputs: [v_ego, v_lim], outputs: [v_cmd]}
      assumption: "G(v_ego >= -EPS_LOC and v_lim >= 0)"
      guarantee: "G(v_cmd <= v_lim - EPS_TRACK)"