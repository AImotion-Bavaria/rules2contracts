rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): vehicles must not drive faster than the speed limit of their current lane. The plant tracks the commanded velocity within a bounded error, so the planning command must be tightened by this tracking margin to guarantee the true velocity respects the limit.
source_text: >
  StVO §3(1)/§18: "Fahrzeuge dürfen nicht schneller fahren als die zulässige Höchstgeschwindigkeit der befahrenen Fahrbahn."
sampling_rate_hz: 10
horizon: 8
constants:
  EPS_PLANT: 1.0
  EPS_LOC: 0.0
environment:
  signals:
    - {name: v_lim, sort: real}
    - {name: v_true, sort: real}
system_contract:
  interface: {inputs: [v_lim, v_true], outputs: [v_cmd]}
  assumption: "G(v_lim >= 0 and abs(v_true - v_cmd) <= EPS_PLANT)"
  guarantee: "G(v_true <= v_lim)"
decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_LOC)"
    - service: Planning
      interface: {inputs: [v_ego, v_lim], outputs: [v_cmd]}
      assumption: "G(v_ego >= 0 and v_lim >= 0 and abs(v_ego - v_true) <= EPS_LOC)"
      guarantee: "G(v_cmd <= v_lim - EPS_PLANT)"