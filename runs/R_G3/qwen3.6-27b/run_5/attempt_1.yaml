rule_id: R_G3_llm
description: >
  Maximum speed limit compliance: the vehicle's longitudinal velocity must not exceed the current lane's speed limit.
source_text: >
  StVO §3(1)/§18: "Fahrzeuge dürfen nicht schneller fahren als die zulässige Höchstgeschwindigkeit der befahrenen Fahrbahn."
sampling_rate_hz: 10
horizon: 8
constants:
  EPS_TRACK: 1.0
environment:
  signals:
    - {name: v_limit, sort: real}
system_contract:
  interface: {inputs: [v_limit], outputs: [v_ego, v_cmd]}
  assumption: "G(v_limit >= 0 and abs(v_ego - v_cmd) <= EPS_TRACK)"
  guarantee: "G(v_ego <= v_limit)"
decomposition:
  discharge_order: [Planning]
  contracts:
    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd]}
      assumption: "G(v_limit >= 0)"
      guarantee: "G(v_cmd <= v_limit - EPS_TRACK)"