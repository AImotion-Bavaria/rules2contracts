rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1), §18): the ego vehicle must never travel
  faster than the speed limit applicable to the lane it is currently driving
  in. The lane speed limit and the true ego velocity are environment
  (ground-truth) signals. The plant tracks the commanded velocity within
  EPS_TRACK = 1.0 m/s, therefore Planning must command a velocity that stays
  below the posted limit by at least that tracking margin. Localization only
  supplies an estimate of the ego velocity (error bound EPS_V), so the
  Planning brake-demand condition and the Control overshoot reaction are
  tightened by EPS_V.
source_text: >
  StVO §3(1): "Die gefahrene Geschwindigkeit ist den Straßen-, Verkehrs-,
  Sicht- und Wetterverhältnissen [...] anzupassen." — §3(3)/§18(5) and
  Zeichen 274: die zulässige Höchstgeschwindigkeit darf nicht überschritten
  werden. Operationalized here as: the true ego velocity must at no time
  exceed the speed limit of the currently occupied lane.
sampling_rate_hz: 10
horizon: 10

constants:
  EPS_TRACK: 1.0    # plant velocity-tracking bound |v_true - v_cmd| [m/s]
  EPS_V: 0.5        # localization velocity estimation error bound [m/s]
  V_MAX: 70.0       # max considered velocity / speed limit [m/s]

environment:
  signals:
    - {name: v_true, sort: real}    # true ego longitudinal velocity [m/s]
    - {name: v_limit, sort: real}   # speed limit of the currently occupied lane [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd, a_plan, a_cmd, v_ego]}
  assumption: "G(v_true >= 0 and v_true <= V_MAX and v_limit >= 0 and v_limit <= V_MAX and v_true - v_cmd <= EPS_TRACK)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd, a_plan]}
      assumption: "G(v_limit >= 0 and v_limit <= V_MAX and v_ego >= 0 - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G(v_cmd <= v_limit - EPS_TRACK and (v_ego >= v_limit - EPS_TRACK - EPS_V -> a_plan <= 0))"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [a_cmd]}
      assumption: "G(v_ego >= 0 - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G((a_plan <= 0 -> a_cmd <= 0) and (v_ego - v_cmd >= EPS_V + EPS_TRACK -> a_cmd <= 0))"