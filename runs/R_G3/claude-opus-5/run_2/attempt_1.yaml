rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1) / §18): the true ego velocity must never
  exceed the speed limit that applies to the lane the vehicle is currently
  driving in. The lane speed limit is an environment signal (map / traffic
  sign information). The plant tracks the commanded velocity within
  EPS_TRACK = 1.0 m/s, so Planning must command a velocity that stays below
  the limit by at least that tracking margin. Localization estimates the ego
  velocity with a bounded error EPS_V, so every ego-velocity-based monitor
  threshold inside Planning and Control is tightened by EPS_V.
source_text: >
  StVO §3 Abs. 1: "Die gefahrene Geschwindigkeit ist den Straßen-, Verkehrs-,
  Sicht- und Witterungsverhältnissen [...] anzupassen." StVO §18 Abs. 5 and
  Zeichen 274 (zulässige Höchstgeschwindigkeit): a vehicle must not be driven
  faster than the permitted maximum speed applicable to its current lane.
sampling_rate_hz: 10
horizon: 10

constants:
  EPS_TRACK: 1.0    # plant velocity-tracking error bound |v_true - v_cmd| [m/s]
  EPS_V: 0.5        # localization velocity estimation error bound [m/s]
  EPS_A: 0.3        # control acceleration realization tolerance [m/s^2]
  V_MAX: 70.0       # maximum considered velocity [m/s]
  V_LIM_MIN: 5.0    # minimum admissible posted lane speed limit [m/s]

environment:
  signals:
    - {name: v_true, sort: real}    # true ego velocity [m/s]
    - {name: v_limit, sort: real}   # speed limit of the currently occupied lane [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd, a_plan, a_cmd, v_ego]}
  assumption: "G(v_true >= 0 and v_true <= V_MAX and v_limit >= V_LIM_MIN and v_limit <= V_MAX and abs(v_true - v_cmd) <= EPS_TRACK)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego >= 0 - EPS_V and v_ego <= V_MAX + EPS_V and v_limit >= V_LIM_MIN and v_limit <= V_MAX)"
      guarantee: "G(v_cmd <= v_limit - EPS_TRACK and v_cmd >= 0 and (v_ego >= v_limit - EPS_TRACK - EPS_V -> a_plan <= 0))"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [a_cmd]}
      assumption: "G(v_cmd >= 0 and v_cmd <= V_MAX and v_ego >= 0 - EPS_V)"
      guarantee: "G(a_cmd <= a_plan + EPS_A and (v_ego >= v_cmd + EPS_V -> a_cmd <= 0))"