rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): The vehicle must not exceed the speed limit of its current lane.
source_text: >
  StVO §3(1): "Wer ein Fahrzeug führt, darf nur so schnell fahren, dass das Fahrzeug ständig beherrscht wird."
  StVO §18: Lane-specific speed limits must be obeyed.
sampling_rate_hz: 10
horizon: 8

constants:
  TRACKING_ERROR: 1.0  # plant tracking error bound for v_cmd -> v_ego [m/s]
  EPS_V: 0.5  # localization velocity error bound [m/s]

environment:
  signals:
    - {name: v_true, sort: real}
    - {name: speed_limit, sort: real}

system_contract:
  interface: {inputs: [v_true, speed_limit], outputs: [v_cmd]}
  assumption: "G(speed_limit >= 0 and v_true >= 0)"
  guarantee: "G(v_true <= speed_limit + TRACKING_ERROR + EPS_V)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego, speed_limit], outputs: [v_cmd]}
      assumption: "G(speed_limit >= 0 and v_ego >= -EPS_V)"
      guarantee: "G(v_cmd <= speed_limit)"

    - service: Control
      interface: {inputs: [v_cmd, v_ego], outputs: [a_cmd]}
      assumption: "G(v_cmd >= -EPS_V)"
      guarantee: "G(abs(v_ego - v_cmd) <= TRACKING_ERROR)"