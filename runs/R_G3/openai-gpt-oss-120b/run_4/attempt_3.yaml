rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): the vehicle must never travel faster than the
  speed limit of its current lane. The lane speed limit is provided as an environment
  signal. Localization estimates the ego speed with a bounded error EPS_V, therefore
  the planning module must keep the estimated speed at least EPS_V below the limit,
  guaranteeing the true speed respects the limit.
source_text: >
  StVO §3(1)/§18 – “Fahrzeuge dürfen nicht schneller fahren als die für die jeweilige Fahrspur
  geltende Höchstgeschwindigkeit.” The plant tracks the commanded velocity within 1.0 m/s.
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_V: 1.0    # bound on localization speed estimation error [m/s]

environment:
  signals:
    - {name: speed_limit, sort: real}   # lane speed limit [m/s]
    - {name: v_true, sort: real}        # true ego speed [m/s]

system_contract:
  interface: {inputs: [speed_limit, v_true], outputs: []}
  assumption: "G(speed_limit >= 0 and v_true >= 0)"
  guarantee: "G(v_true <= speed_limit)"

decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V and v_ego >= 0)"
    - service: Planning
      interface: {inputs: [v_ego, speed_limit], outputs: [v_cmd]}
      assumption: "G(speed_limit >= 0)"
      guarantee: "G(v_ego <= speed_limit - EPS_V)"