rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): the vehicle must not exceed the
  speed limit of its current lane. The lane speed limit is provided as an
  environment signal. The plant tracks the commanded velocity within a
  bounded error of 1.0 m/s, therefore the planning command is tightened by
  that margin to guarantee the true speed respects the limit.
source_text: >
  StVO §3(1)/§18 – “Fahrzeuge dürfen nicht schneller fahren als die
  zulässige Höchstgeschwindigkeit der jeweiligen Fahrspur.”
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_V: 1.0    # plant tracking error bound [m/s]

environment:
  signals:
    - {name: speed_limit, sort: real}   # lane speed limit [m/s]
    - {name: v_true, sort: real}        # true ego velocity [m/s]

system_contract:
  interface: {inputs: [speed_limit], outputs: [v_cmd]}
  assumption: "G(speed_limit >= 0)"
  guarantee: "G(v_cmd <= speed_limit - EPS_V)"

decomposition:
  discharge_order: [Planning]
  contracts:
    - service: Planning
      interface: {inputs: [speed_limit], outputs: [v_cmd]}
      assumption: "G(speed_limit >= 0)"
      guarantee: "G(v_cmd <= speed_limit - EPS_V)"