rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): the vehicle must not travel faster than the
  speed limit of its current lane. The plant follows the commanded velocity within a
  bounded tracking error of 1.0 m/s, and localization provides the ego speed with an
  error bound of 0.5 m/s, so the planning module must command a speed that leaves a
  safety margin for the tracking error.
source_text: >
  StVO §3(1)/§18 – "Fahrzeuge dürfen nicht schneller als die zulässige Höchstgeschwindigkeit
  der jeweiligen Fahrspur fahren."
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_TRACK: 1.0    # plant tracking error bound [m/s]
  EPS_LOC: 0.5      # localization velocity error bound [m/s]
  V_MAX: 70.0       # maximum considered speed limit [m/s]

environment:
  signals:
    - {name: speed_limit, sort: real}   # lane speed limit [m/s]
    - {name: v_true, sort: real}        # true ego velocity [m/s]

system_contract:
  interface: {inputs: [speed_limit, v_true], outputs: [v_cmd]}
  assumption: "G(speed_limit >= 0 and speed_limit <= V_MAX)"
  guarantee: "G(v_true <= speed_limit)"

decomposition:
  discharge_order: [Localization, Planning, Plant]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_LOC)"

    - service: Planning
      interface: {inputs: [v_ego, speed_limit], outputs: [v_cmd]}
      assumption: "G(v_ego >= -EPS_LOC and speed_limit >= 0 and speed_limit <= V_MAX)"
      guarantee: "G(v_cmd <= speed_limit - EPS_TRACK)"

    - service: Plant
      interface: {inputs: [v_cmd], outputs: [v_true]}
      assumption: "G(true)"
      guarantee: "G(abs(v_true - v_cmd) <= EPS_TRACK)"