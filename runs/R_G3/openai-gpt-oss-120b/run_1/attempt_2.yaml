rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): the vehicle must not exceed the
  speed limit of its current lane. The lane speed limit is provided as an
  environment signal. The plant tracks the commanded velocity within a
  bounded error of 1.0 m/s, therefore the planning module must tighten the
  command by that margin to guarantee the true ego speed stays within the
  limit.
source_text: >
  StVO §3(1)/§18 – “Fahrzeuge dürfen nicht schneller fahren als die
  zulässige Höchstgeschwindigkeit der jeweiligen Fahrspur.”
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_V: 1.0    # plant tracking error bound [m/s]

environment:
  signals:
    - {name: v_true, sort: real}    # true ego speed [m/s]
    - {name: v_limit, sort: real}   # speed limit of the current lane [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd, v_ego]}
  assumption: "G(v_true >= 0 and v_limit >= 0 and abs(v_true - v_cmd) <= EPS_V)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= 0)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd]}
      assumption: "G(v_ego >= 0 and v_limit >= 0)"
      guarantee: "G(v_cmd <= v_limit - EPS_V)"