rule_id: R_G3_llm
description: >
  Maximum speed limit compliance (StVO §3(1)/§18): The vehicle must not
  exceed the speed limit of the current lane. The planning component must
  command velocities that account for plant tracking errors and localization
  errors to ensure true velocity remains within the limit.
source_text: >
  StVO §3(1)/§18: "The vehicle speed must not exceed the posted speed
  limit for the current lane." Context: Plant tracking error bounded by
  1.0 m/s. Localization error bounded by 0.5 m/s.
sampling_rate_hz: 10
horizon: 8

constants:
  TRACK_ERR: 1.0      # Plant tracking error bound [m/s]
  LOC_ERR: 0.5        # Localization velocity error bound [m/s]
  MARGIN: 1.5         # Total safety margin (TRACK_ERR + LOC_ERR)
  V_MIN_LIMIT: 1.5    # Minimum valid speed limit to allow non-negative command

environment:
  signals:
    - {name: v_true, sort: real}   # True ego velocity [m/s]
    - {name: v_limit, sort: real}  # Lane speed limit [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_ego, v_cmd, a_cmd]}
  assumption: "G(v_true >= 0 and v_limit >= V_MIN_LIMIT)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= LOC_ERR)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd]}
      assumption: "G(v_limit >= V_MIN_LIMIT and v_ego >= -LOC_ERR)"
      guarantee: "G(v_cmd >= 0 and v_cmd <= v_limit - MARGIN)"

    - service: Control
      interface: {inputs: [v_cmd, v_ego], outputs: [a_cmd]}
      assumption: "G(v_cmd >= 0 and v_ego >= -LOC_ERR)"
      guarantee: "G(abs(v_ego - v_cmd) <= TRACK_ERR)"