rule_id: R_G3_llm
description: >
  Maximum speed limit (StVO §3(1)/§18): The automated vehicle must not exceed
  the speed limit of the current lane. The contract accounts for localization
  estimation error and plant tracking error to ensure the true velocity remains
  within the legal limit.
source_text: >
  StVO §3(1) / §18: "The vehicle driver must not drive faster than the maximum
  speed permitted by traffic signs or general speed limits." Requires true ego
  velocity to remain below the lane speed limit at all times.
sampling_rate_hz: 10
horizon: 8

constants:
  EPS_TRACK: 1.0
  EPS_V: 0.5
  V_LIMIT_MAX: 100.0

environment:
  signals:
    - {name: v_true, sort: real}
    - {name: v_limit, sort: real}

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd]}
  assumption: "G(v_limit >= 0 and v_limit <= V_LIMIT_MAX and abs(v_true - v_cmd) <= EPS_TRACK)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(true)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd]}
      assumption: "G(v_limit >= 0)"
      guarantee: "G(v_cmd <= v_limit - EPS_TRACK - EPS_V)"