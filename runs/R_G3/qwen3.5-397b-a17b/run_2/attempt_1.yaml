rule_id: R_G3_llm
description: >
  Maximum speed limit enforcement (StVO §3(1)/§18): The vehicle must not
  exceed the lane speed limit. Planning commands velocity with a margin
  to compensate for plant tracking error, ensuring true velocity stays
  within the limit.
source_text: >
  StVO §3(1)/§18: "The vehicle driver must not drive faster than the speed
  limit of their current lane. The speed must be adapted to the road,
  traffic, visibility and weather conditions."
sampling_rate_hz: 10
horizon: 10

constants:
  DELTA_TRACK: 1.0    # Plant tracking error bound [m/s]
  EPS_LOC: 0.5        # Localization velocity error bound [m/s]
  V_MAX: 70.0         # Max considered velocity [m/s]

environment:
  signals:
    - {name: v_true, sort: real}   # True ego velocity [m/s]
    - {name: v_limit, sort: real}  # Lane speed limit [m/s]

system_contract:
  interface: {inputs: [v_true, v_limit], outputs: [v_cmd]}
  assumption: "G(v_true >= 0 and v_true <= V_MAX and abs(v_true - v_cmd) <= DELTA_TRACK)"
  guarantee: "G(v_true <= v_limit)"

decomposition:
  discharge_order: [Localization, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_LOC)"

    - service: Planning
      interface: {inputs: [v_ego, v_limit], outputs: [v_cmd]}
      assumption: "G(v_ego >= 0 - EPS_LOC)"
      guarantee: "G(v_cmd <= v_limit - DELTA_TRACK)"