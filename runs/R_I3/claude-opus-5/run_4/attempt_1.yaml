rule_id: R_I3_llm
description: >
  No reversing on the interstate (StVO §18(7)). At feature level the rule is
  interpreted as a state invariant on the ground-truth longitudinal ego
  velocity: it must never drop below V_REV_MIN = -0.3 m/s. The plant can only
  move backwards if the reverse gear has been commanded within the actuation
  latency window TAU_GEAR; this is stated as a system-level tracking
  assumption linking the Control feature gear_rev_cmd to the environment
  signal v_true. The guarantee is therefore discharged by Control never
  requesting the reverse gear, which in turn is justified by Planning never
  commanding a negative trajectory velocity, which relies on the bounded
  Localization velocity error.
source_text: >
  StVO §18 (7): "Wenden und Rückwärtsfahren sind [auf Autobahnen und
  Kraftfahrstraßen] verboten." — Reversing manoeuvres are prohibited on the
  interstate.
sampling_rate_hz: 10
horizon: 10

constants:
  V_REV_MIN: -0.3      # tolerated backward velocity (rollback tolerance) [m/s]
  TAU_GEAR: 2          # gear/actuation latency window [steps] (200 ms at 10 Hz)
  EPS_V: 0.5           # localization velocity error bound [m/s]
  V_MAX: 70.0          # max considered absolute velocity magnitude [m/s]
  V_CMD_MIN: 0.0       # minimum admissible commanded velocity [m/s]

environment:
  signals:
    - {name: v_true, sort: real}          # true longitudinal ego velocity [m/s]
    - {name: on_interstate, sort: bool}   # ego is on Autobahn/Kraftfahrstraße

system_contract:
  interface: {inputs: [v_true, on_interstate], outputs: [v_cmd, gear_rev_cmd]}
  assumption: >
    G(on_interstate and v_true <= V_MAX and v_true >= 0 - V_MAX
      and (H[0,2](not gear_rev_cmd) -> v_true >= V_REV_MIN))
  guarantee: "G(v_true >= V_REV_MIN)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true <= V_MAX and v_true >= 0 - V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd]}
      assumption: "G(v_ego <= V_MAX + EPS_V and v_ego >= 0 - V_MAX - EPS_V)"
      guarantee: "G(v_cmd >= V_CMD_MIN)"

    - service: Control
      interface: {inputs: [v_cmd, v_ego], outputs: [gear_rev_cmd]}
      assumption: "G(v_cmd >= V_CMD_MIN)"
      guarantee: "G(v_cmd >= V_CMD_MIN -> not gear_rev_cmd)"