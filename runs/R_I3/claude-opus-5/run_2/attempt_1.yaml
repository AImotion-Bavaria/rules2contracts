rule_id: R_I3_llm
description: >
  No reversing on the interstate (StVO §18(7)). Interpreted at feature level:
  the true longitudinal ego velocity must never drop below -V_REV_MIN
  (-0.3 m/s), i.e. no backward motion beyond a rolling tolerance. The plant
  only moves backwards if the reverse gear has been commanded within the
  actuation delay window (TAU_REV = 2 steps at 10 Hz); this link between the
  Control feature gear_rev_cmd and the environment signal v_true is stated as
  the system-level tracking assumption. The decomposition therefore has to
  establish that the reverse gear is never commanded: Planning never emits a
  negative target velocity (its trigger is tightened by the localization error
  bound EPS_V so that a noisy v_ego can never force a negative v_cmd), and
  Control keeps the gear out of REVERSE whenever the commanded velocity is
  non-negative.
source_text: >
  StVO §18 Absatz 7: "Wenden und Rückwärtsfahren sind verboten." (Auf
  Autobahnen und Kraftfahrstraßen ist das Rückwärtsfahren untersagt.)
sampling_rate_hz: 10
horizon: 8

constants:
  V_REV_MIN: 0.3     # tolerated backward-rolling magnitude [m/s]
  EPS_V: 0.5         # localization velocity error bound [m/s]
  V_MAX: 70.0        # max considered forward velocity [m/s]
  TAU_REV: 2         # gear actuation / motion-onset delay [steps]

environment:
  signals:
    - {name: v_true, sort: real}        # true longitudinal ego velocity [m/s]
    - {name: on_interstate, sort: bool} # ego is on Autobahn / Kraftfahrstraße

system_contract:
  interface: {inputs: [v_true, on_interstate], outputs: [v_cmd, gear_rev_cmd]}
  assumption: "G(v_true <= V_MAX and on_interstate and (v_true < 0 - V_REV_MIN -> O[0,2](gear_rev_cmd)))"
  guarantee: "G(v_true >= 0 - V_REV_MIN)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 - V_REV_MIN and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V and v_ego >= 0 - V_REV_MIN - EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego >= 0 - V_REV_MIN - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G(v_cmd >= 0)"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [gear_rev_cmd, a_cmd]}
      assumption: "G(v_cmd >= 0 and v_ego >= 0 - V_REV_MIN - EPS_V)"
      guarantee: "G((v_cmd >= 0 and v_ego >= 0 - V_REV_MIN - EPS_V) -> not gear_rev_cmd)"