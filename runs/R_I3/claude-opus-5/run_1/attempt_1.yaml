rule_id: R_I3_llm
description: >
  No reversing on the interstate (StVO §18(7)). At feature level the rule is
  interpreted as: the true longitudinal ego velocity must never drop below
  -0.3 m/s, i.e. the vehicle never performs a backward manoeuvre. The plant
  can only move backwards when the reverse gear is commanded, so the system
  assumption contains a gear/plant tracking model linking the Control feature
  gear_rev_cmd to the environment signal v_true. The obligation is discharged
  by Control (never command REVERSE), which in turn relies on Planning never
  emitting a backward velocity command; Planning relies on the Localization
  velocity estimate whose bounded error is compensated in the thresholds.
source_text: >
  StVO §18 Abs. 7: "Wenden und Rückwärtsfahren sind [auf Autobahnen und
  Kraftfahrstraßen] verboten." (Turning around and reversing are prohibited
  on the interstate / motorway, including entries, exits and connecting
  roadways.)
sampling_rate_hz: 10
horizon: 10

constants:
  V_REV_TOL: 0.3     # tolerated backward velocity magnitude [m/s]
  V_REV_HYST: 0.1    # command hysteresis below which Control still refuses REVERSE [m/s]
  EPS_V: 0.5         # localization velocity error bound [m/s]
  V_MAX: 70.0        # max considered forward velocity [m/s]
  A_MIN: -8.0        # min admissible planned acceleration [m/s^2]

environment:
  signals:
    - {name: v_true, sort: real}        # true longitudinal ego velocity [m/s]
    - {name: on_interstate, sort: bool} # ego is on a motorway / Kraftfahrstraße

system_contract:
  interface: {inputs: [v_true, on_interstate], outputs: [v_cmd, a_plan, v_ego, gear_rev_cmd]}
  assumption: >
    G(v_true <= V_MAX and v_true >= 0 - V_MAX and
      (H[0,1](not gear_rev_cmd) -> v_true >= 0 - V_REV_TOL))
  guarantee: "G(on_interstate -> v_true >= 0 - V_REV_TOL)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego, a_ego]}
      assumption: "G(v_true <= V_MAX and v_true >= 0 - V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V and v_ego <= V_MAX + EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego, a_ego, d_lead, v_lead], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego <= V_MAX + EPS_V and v_ego >= 0 - V_MAX - EPS_V)"
      guarantee: "G(v_cmd >= 0 and a_plan >= A_MIN)"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [a_cmd, gear_rev_cmd]}
      assumption: "G(v_cmd >= 0 and a_plan >= A_MIN)"
      guarantee: "G((v_cmd >= 0 - V_REV_HYST) -> not gear_rev_cmd)"