rule_id: R_I3_llm
description: >
  No reversing on the interstate (StVO §18(7)). Reversing (and turning
  around / driving against the direction of travel) is forbidden on
  motorways and expressways. At feature level the requirement is
  interpreted as: the true longitudinal ego velocity must never drop
  below -V_TOL = -0.3 m/s while the ego vehicle is on the interstate.
  The plant can only move backwards if the reverse gear has been
  commanded within the actuation latency window (K_GEAR = 3 steps at
  10 Hz); this is stated as a system-level tracking assumption linking
  the Control feature gear_rev_cmd to the environment signal v_true.
  The decomposition therefore reduces the requirement to: Localization
  estimates v_ego with a bounded error, Planning never emits a negative
  commanded velocity (threshold tightened by the localization error
  bound EPS_V), and Control never commands the reverse gear as long as
  the commanded velocity is non-negative up to that bound.
source_text: >
  StVO §18(7): "Rückwärtsfahren und Wenden sind auf Autobahnen und
  Kraftfahrstraßen verboten." (Reversing and turning around are
  prohibited on motorways and expressways.)
sampling_rate_hz: 10
horizon: 30

constants:
  V_TOL: 0.3        # tolerated backward-velocity magnitude (rollback noise) [m/s]
  EPS_V: 0.5        # localization longitudinal velocity error bound [m/s]
  V_MAX: 70.0       # max plausible forward ego velocity [m/s]
  V_BACK_MAX: 5.0   # max plausible backward ego velocity magnitude [m/s]

environment:
  signals:
    - {name: v_true, sort: real}        # true longitudinal ego velocity [m/s]
    - {name: on_motorway, sort: bool}   # ego is on an interstate (Autobahn/Kraftfahrstraße)

system_contract:
  interface:
    inputs: [v_true, on_motorway]
    outputs: [v_cmd, a_plan, gear_rev_cmd, v_ego]
  assumption: >
    G(on_motorway and v_true <= V_MAX and v_true >= 0 - V_BACK_MAX
      and (not O[0,3](gear_rev_cmd) -> v_true >= 0 - V_TOL))
  guarantee: "G(v_true >= 0 - V_TOL)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true <= V_MAX and v_true >= 0 - V_BACK_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego >= 0 - V_BACK_MAX - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G(v_cmd >= 0 and a_plan >= 0 - V_MAX)"

    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [gear_rev_cmd, a_cmd]}
      assumption: "G(v_cmd >= 0 - EPS_V)"
      guarantee: "G((v_cmd >= 0 - EPS_V) -> not gear_rev_cmd)"