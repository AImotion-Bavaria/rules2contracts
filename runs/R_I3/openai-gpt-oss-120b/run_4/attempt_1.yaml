rule_id: R_I3_llm
description: >-
  No reversing manoeuvres are permitted on the interstate (StVO §18(7)):
  the true longitudinal ego velocity must never drop below -0.3 m/s.
source_text: >-
  StVO §18(7): "Reversing manoeuvres are prohibited on the interstate."
sampling_rate_hz: 10
horizon: 8

constants:
  V_REV_MAX: -0.3        # maximum allowed reverse speed [m/s]
  EPS_V: 0.2            # localization velocity error bound [m/s]

environment:
  signals:
    - {name: v_true, sort: real}   # true longitudinal ego velocity [m/s]

system_contract:
  interface: {inputs: [v_true, gear_rev_cmd], outputs: []}
  assumption: "G(gear_rev_cmd -> v_true <= V_REV_MAX)"
  guarantee: "G(v_true >= V_REV_MAX)"

decomposition:
  discharge_order: [Localization, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= V_REV_MAX and v_true <= 50)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"
    - service: Control
      interface: {inputs: [v_ego], outputs: [gear_rev_cmd]}
      assumption: "G(v_ego >= V_REV_MAX + EPS_V)"
      guarantee: "G(not gear_rev_cmd)"