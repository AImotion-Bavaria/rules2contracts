rule_id: R_I3_llm
description: >
  StVO §18(7) No reversing on interstate: The vehicle must not perform reversing
  manoeuvres. At feature level, the true longitudinal velocity must not drop
  below -0.3 m/s. System assumes plant backward motion only occurs if reverse
  gear is commanded.
source_text: >
  StVO §18(7): "Reversing and turning are prohibited on the interstate."
  Interpretation: True longitudinal ego velocity must never drop below -0.3 m/s.
  Plant assumption: Backward motion implies reverse gear command.
sampling_rate_hz: 10
horizon: 8

constants:
  V_MIN_RULE: -0.3    # Rule limit for true velocity [m/s]
  V_DRIFT_MAX: -0.1   # Max backward drift without reverse gear [m/s]
  EPS_V: 0.1          # Localization velocity error bound [m/s]

environment:
  signals:
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [v_true], outputs: [v_ego, v_cmd, gear_rev_cmd]}
  assumption: "G(not gear_rev_cmd -> v_true >= V_DRIFT_MAX)"
  guarantee: "G(v_true >= V_MIN_RULE)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= -50.0 and v_true <= 50.0)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd]}
      assumption: "G(v_ego >= -50.0 and v_ego <= 50.0)"
      guarantee: "G(v_cmd >= 0.0)"

    - service: Control
      interface: {inputs: [v_ego, v_cmd], outputs: [gear_rev_cmd]}
      assumption: "G(v_cmd >= 0.0)"
      guarantee: "G(v_cmd >= 0.0 -> not gear_rev_cmd)"