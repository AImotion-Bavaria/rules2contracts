rule_id: R_I3_llm
description: >
  No reversing on interstate (StVO §18(7)): The true longitudinal ego velocity
  must never drop below -0.3 m/s. The system ensures this by prohibiting reverse
  gear commands unconditionally. A plant assumption links the gear command to
  true velocity, ensuring backward motion is impossible without reverse gear.
  Localization error bounds are accounted for in signal range assumptions.
source_text: >
  StVO §18(7): "Reversing manoeuvres are prohibited on the interstate."
  Interpretation: True longitudinal ego velocity must remain >= -0.3 m/s.
sampling_rate_hz: 10
horizon: 8

constants:
  V_REV_LIMIT: -0.3
  EPS_V: 0.5
  V_MAX: 70.0

environment:
  signals:
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(v_true >= -V_MAX and v_true <= V_MAX and (not gear_rev_cmd -> v_true >= 0))"
  guarantee: "G(v_true >= V_REV_LIMIT)"

decomposition:
  discharge_order: [Localization, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= -V_MAX and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Control
      interface: {inputs: [v_ego], outputs: [gear_rev_cmd]}
      assumption: "G(v_ego >= -V_MAX - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G(not gear_rev_cmd)"