rule_id: R_I3_llm
description: >
  No reversing on interstate (StVO §18(7)): The true longitudinal ego velocity
  must never drop below -0.3 m/s. The system ensures this by prohibiting reverse
  gear commands, relying on a plant assumption that backward motion only occurs
  when reverse gear is engaged. Localization error bounds are compensated in the
  Control component's decision threshold.
source_text: >
  StVO §18(7): "Reversing manoeuvres are prohibited on the interstate."
  Interpretation: True longitudinal ego velocity must remain >= -0.3 m/s.
sampling_rate_hz: 10
horizon: 8

constants:
  V_REV_LIMIT: -0.3   # Maximum allowed backward velocity [m/s]
  EPS_V: 0.5          # Localization velocity error bound [m/s]
  V_MIN_OP: 0.7       # Minimum operating velocity on interstate [m/s]

environment:
  signals:
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(not gear_rev_cmd -> v_true >= V_REV_LIMIT and v_true >= V_MIN_OP)"
  guarantee: "G(v_true >= V_REV_LIMIT)"

decomposition:
  discharge_order: [Localization, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= V_MIN_OP)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Control
      interface: {inputs: [v_ego], outputs: [gear_rev_cmd]}
      assumption: "G(v_ego >= V_MIN_OP - EPS_V)"
      guarantee: "G(v_ego >= V_REV_LIMIT + EPS_V -> not gear_rev_cmd)"