rule_id: R_I3_llm
description: >
  StVO §18(7): reversing manoeuvres are prohibited on the interstate.
  Formalized at feature level: the true longitudinal ego velocity must
  never drop below a small negative threshold (numerical tolerance for
  rollback/creep), i.e. no sustained backward motion. Since the vehicle
  moves backwards only when the reverse gear is engaged, this reduces to
  a system-level guarantee that the Control component never issues the
  reverse gear command, combined with a plant/tracking assumption linking
  gear command to true velocity.
source_text: >
  StVO §18 Abs. 7: "Rückwärtsfahren, Wenden und Fahren entgegen der
  Fahrtrichtung sind auf der Autobahn und der Kraftfahrstraße verboten."
sampling_rate_hz: 10
horizon: 4

constants:
  V_REV_MIN: -0.3   # minimal tolerated (numerical) backward velocity [m/s]
  V_MAX: 70.0        # max considered velocity magnitude [m/s]

environment:
  signals:
    - {name: v_true, sort: real}   # true longitudinal ego velocity [m/s]

system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(not gear_rev_cmd -> v_true >= V_REV_MIN)"
  guarantee: "G(v_true >= V_REV_MIN)"

decomposition:
  discharge_order: [Control]
  contracts:
    - service: Control
      interface: {inputs: [v_cmd, a_plan], outputs: [gear_rev_cmd]}
      assumption: "G(v_cmd >= 0 - V_MAX and v_cmd <= V_MAX)"
      guarantee: "G(not gear_rev_cmd)"