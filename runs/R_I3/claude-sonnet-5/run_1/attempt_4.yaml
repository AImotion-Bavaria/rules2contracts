rule_id: R_I3_llm
description: >
  StVO §18(7): reversing manoeuvres are prohibited on the interstate.
  Formalized at feature level as a lower bound on the true longitudinal
  ego velocity: it must never drop below -0.3 m/s (a small tolerance for
  sensor/actuation noise around a full stop, but excluding genuine
  backward travel). The plant only moves backwards if the reverse gear is
  commanded, so the system assumption is a tracking/plant model tying
  gear_rev_cmd to v_true_ego. The decomposition shows Localization
  estimates v_ego within a bounded error of v_true_ego, Planning never
  requests negative velocity given a plausible velocity estimate, and
  Control never engages reverse gear when a non-negative velocity is
  commanded.
source_text: >
  StVO §18(7): "Rückwärtsfahren [...] auf der Autobahn [...] sind
  unzulässig."
sampling_rate_hz: 10
horizon: 4

constants:
  V_MIN: -0.3    # minimal tolerated true longitudinal velocity [m/s]
  V_MAX: 70.0    # domain bound on considered velocities [m/s]
  EPS_V: 0.5     # localization velocity error bound [m/s]

environment:
  signals:
    - {name: v_true_ego, sort: real}   # true longitudinal ego velocity [m/s]

system_contract:
  interface: {inputs: [v_true_ego], outputs: [gear_rev_cmd]}
  assumption: >
    G((v_true_ego >= 0 - V_MAX and v_true_ego <= V_MAX) and
    (not gear_rev_cmd -> v_true_ego >= V_MIN))
  guarantee: "G(v_true_ego >= V_MIN)"

decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true_ego], outputs: [v_ego]}
      assumption: "G(v_true_ego >= 0 - V_MAX and v_true_ego <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true_ego) <= EPS_V)"

    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd]}
      assumption: "G(v_ego >= 0 - V_MAX - EPS_V and v_ego <= V_MAX + EPS_V)"
      guarantee: "G(v_cmd >= 0)"

    - service: Control
      interface: {inputs: [v_cmd], outputs: [gear_rev_cmd]}
      assumption: "G(v_cmd >= 0)"
      guarantee: "G(not gear_rev_cmd)"