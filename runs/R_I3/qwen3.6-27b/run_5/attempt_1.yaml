rule_id: R_I3_llm
description: >
  No reversing (StVO §18(7)): reversing manoeuvres are prohibited on the interstate.
  Interpret at feature level: the true longitudinal ego velocity must never drop below -0.3 m/s.
source_text: >
  StVO §18(7): "Das Rückwärtsfahren ist auf Autobahnen verboten."
sampling_rate_hz: 10
horizon: 8
constants:
  V_REV_THRESH: -0.3
environment:
  signals:
    - {name: v_true, sort: real}
system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(not gear_rev_cmd -> v_true >= 0)"
  guarantee: "G(v_true >= V_REV_THRESH)"
decomposition:
  discharge_order: [Control]
  contracts:
    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [gear_rev_cmd]}
      assumption: "G(true)"
      guarantee: "G(not gear_rev_cmd)"