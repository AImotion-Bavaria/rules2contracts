rule_id: R_I3_llm
description: >
  Formalization of StVO §18(7) prohibiting reversing on interstates.
  At the feature level, the true longitudinal ego velocity must never
  drop below -0.3 m/s. The system assumes the plant only moves backwards
  when the reverse gear is commanded, and guarantees the velocity bound
  by ensuring the reverse gear is never engaged.
source_text: >
  StVO §18(7): "Das Rückwärtsfahren ist auf Autobahnen und
  Autobahnzubringern verboten."
sampling_rate_hz: 10
horizon: 8
constants:
  V_REV_THRESH: -0.3
  EPS_V: 0.5
  V_MIN: -10.0
environment:
  signals:
    - {name: v_true, sort: real}
system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(v_true >= V_MIN and (v_true < 0 -> gear_rev_cmd))"
  guarantee: "G(v_true >= V_REV_THRESH)"
decomposition:
  discharge_order: [Localization, Planning, Control]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= V_MIN)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"
    - service: Planning
      interface: {inputs: [v_ego], outputs: [v_cmd, a_plan]}
      assumption: "G(v_ego >= -10.5)"
      guarantee: "G(v_cmd >= 0)"
    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [gear_rev_cmd]}
      assumption: "G(v_ego >= -10.5 and v_cmd >= 0)"
      guarantee: "G(not gear_rev_cmd)"