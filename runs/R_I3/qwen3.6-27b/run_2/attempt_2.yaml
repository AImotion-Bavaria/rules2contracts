rule_id: R_I3_llm
description: >
  Formalization of StVO §18(7) prohibiting reversing on interstates.
  At the feature level, the true longitudinal ego velocity must never
  drop below -0.3 m/s. The system ensures this by never commanding
  reverse gear, relying on a plant assumption that backward motion
  only occurs when reverse gear is engaged.
source_text: >
  StVO §18(7): "Das Rückwärtsfahren ist verboten." (Reversing is prohibited on the interstate.)
sampling_rate_hz: 10
horizon: 8
constants:
  V_REV_LIMIT: -0.3
environment:
  signals:
    - {name: v_true, sort: real}
system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(not gear_rev_cmd -> v_true >= V_REV_LIMIT)"
  guarantee: "G(v_true >= V_REV_LIMIT)"
decomposition:
  discharge_order: [Control]
  contracts:
    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [gear_rev_cmd]}
      assumption: "G(0 <= 0)"
      guarantee: "G(not gear_rev_cmd)"