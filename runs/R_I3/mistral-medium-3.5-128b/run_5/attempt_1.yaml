rule_id: R_I3_llm
description: >
  No reversing on interstate (StVO §18(7)): true longitudinal ego velocity must never drop below -0.3 m/s. The plant only moves backwards if reverse gear is commanded.
source_text: >
  StVO §18(7): "Rückwärtsfahren ist auf Autobahnen verboten." (Reversing is prohibited on interstates.)
sampling_rate_hz: 10
horizon: 1

constants:
  V_REV_THRESHOLD: -0.3  # minimum allowed true longitudinal velocity [m/s]

environment:
  signals:
    - {name: v_true, sort: real}   # true ego velocity [m/s]

system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(gear_rev_cmd -> v_true <= 0)"
  guarantee: "G(v_true >= V_REV_THRESHOLD)"

decomposition:
  discharge_order: [Control]
  contracts:
    - service: Control
      interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
      assumption: "G(v_true >= V_REV_THRESHOLD)"
      guarantee: "G(not gear_rev_cmd)"