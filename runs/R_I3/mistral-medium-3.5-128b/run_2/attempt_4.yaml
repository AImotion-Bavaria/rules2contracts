rule_id: R_I3_llm
description: >
  No reversing on interstate (StVO §18(7)): true longitudinal ego velocity must never drop below -0.3 m/s.
source_text: >
  StVO §18(7): "Rückwärtsfahren ist auf Autobahnen verboten."
sampling_rate_hz: 10
horizon: 8

constants:
  V_REV_THRESHOLD: -0.3

environment:
  signals:
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [v_true], outputs: [gear_rev_cmd]}
  assumption: "G(gear_rev_cmd -> v_true <= 0)"
  guarantee: "G(v_true >= V_REV_THRESHOLD)"

decomposition:
  discharge_order: [Control]
  contracts:
    - service: Control
      interface: {inputs: [v_ego, v_cmd, a_plan], outputs: [a_cmd, gear_rev_cmd]}
      assumption: "G(1 >= 0)"
      guarantee: "G(not gear_rev_cmd and v_true >= V_REV_THRESHOLD)"