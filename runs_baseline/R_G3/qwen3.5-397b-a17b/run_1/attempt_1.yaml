rule_id: R_G3_flat
description: Vehicles must not drive faster than the speed limit of their current lane (StVO §3(1)/§18), accounting for 1.0 m/s tracking tolerance.
sampling_rate_hz: 10
horizon: 10
constants:
  TRACKING_TOLERANCE: 1.0
environment:
  signals:
    - {name: v_cmd, sort: real}
    - {name: v_limit, sort: real}
formula: "G(abs(v_cmd) + TRACKING_TOLERANCE <= v_limit)"