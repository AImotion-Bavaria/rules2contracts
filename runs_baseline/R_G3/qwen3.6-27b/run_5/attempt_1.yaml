rule_id: R_G3_flat
description: Vehicles must not drive faster than the speed limit of their current lane.
sampling_rate_hz: 10
horizon: 8
constants:
  TRACKING_ERR: 1.0
environment:
  signals:
    - {name: v_actual, sort: real}
    - {name: v_limit, sort: real}
formula: "G(abs(v_actual) <= v_limit)"