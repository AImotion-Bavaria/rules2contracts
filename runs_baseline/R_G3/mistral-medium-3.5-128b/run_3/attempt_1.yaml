rule_id: R_G3_flat
description: Vehicles must not drive faster than the speed limit of their current lane.
sampling_rate_hz: 10
horizon: 1
constants:
  TRACKING_ERROR: 1.0
environment:
  signals:
    - {name: commanded_velocity, sort: real}
    - {name: lane_speed_limit, sort: real}
formula: "G(commanded_velocity + TRACKING_ERROR <= lane_speed_limit)"