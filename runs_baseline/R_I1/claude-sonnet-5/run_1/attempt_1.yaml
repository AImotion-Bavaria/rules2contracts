rule_id: R_I1_flat
description: >
  StVO §12(1)/§18(8): Stopping on the main carriageway of an interstate is
  prohibited unless there is congestion or the directly leading vehicle is
  stationary. At feature level: whenever there is no congestion and the true
  lead-vehicle velocity is clearly above the standstill threshold, the ego
  vehicle must keep moving at or above the standstill threshold.
sampling_rate_hz: 10
horizon: 0
constants:
  STANDSTILL_THRESH: 0.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: lead_velocity_true, sort: real}
    - {name: ego_velocity_true, sort: real}
formula: "G((not congestion and lead_velocity_true > STANDSTILL_THRESH) -> (ego_velocity_true >= STANDSTILL_THRESH))"
