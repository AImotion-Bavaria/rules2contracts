rule_id: R_I1_flat
description: Stopping on an interstate main carriageway is prohibited unless there is congestion or the lead vehicle is stationary; thus when there is no congestion and the true lead velocity exceeds 0.5 m/s, the ego vehicle must keep moving with velocity ≥ 0.5 m/s.
sampling_rate_hz: 10
horizon: 5
constants:
  V_STANDSTILL: 0.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: true_lead_vel, sort: real}
    - {name: true_ego_vel, sort: real}
formula: "G((not congestion and true_lead_vel > V_STANDSTILL) -> (true_ego_vel >= V_STANDSTILL))"
