rule_id: R_I1_flat
description: Stopping on the main carriageway of an interstate is prohibited unless there is congestion or the directly leading vehicle is stationary.
sampling_rate_hz: 10
horizon: 10
constants:
  V_STANDSTILL: 0.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: lead_velocity, sort: real}
    - {name: ego_velocity, sort: real}
formula: "G((not congestion and lead_velocity > V_STANDSTILL) -> ego_velocity >= V_STANDSTILL)"