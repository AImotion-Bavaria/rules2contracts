rule_id: R_I1_flat
description: Stopping on the main carriageway of an interstate is prohibited unless there is congestion or the leading vehicle is stationary.
sampling_rate_hz: 10
horizon: 10
constants:
  V_MIN: 0.5
environment:
  signals:
    - {name: congestion, sort: bool}
    - {name: true_lead_velocity, sort: real}
    - {name: true_ego_velocity, sort: real}
formula: "G((not congestion and true_lead_velocity > V_MIN) -> (true_ego_velocity >= V_MIN))"