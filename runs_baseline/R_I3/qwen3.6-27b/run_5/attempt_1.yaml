rule_id: R_I3_flat
description: "No reversing on interstate: true longitudinal ego velocity must never drop below -0.3 m/s. Includes system-level tracking assumption that backward motion implies reverse gear command."
sampling_rate_hz: 10
horizon: 8
constants:
  V_MIN: -0.3
environment:
  signals:
    - {name: v_ego, sort: real}
    - {name: gear_cmd_rev, sort: bool}
formula: "G(v_ego >= V_MIN and ((v_ego < 0) -> gear_cmd_rev))"