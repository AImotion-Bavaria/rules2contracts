rule_id: R_I3_flat
description: No reversing on interstate: true longitudinal ego velocity must never drop below -0.3 m/s, with reverse gear command tracking assumption.
sampling_rate_hz: 10
horizon: 8
constants:
  VEL_MIN: -0.3
environment:
  signals:
    - {name: vel_long, sort: real}
    - {name: gear_rev_cmd, sort: bool}
formula: "G((not gear_rev_cmd) -> (vel_long >= VEL_MIN))"