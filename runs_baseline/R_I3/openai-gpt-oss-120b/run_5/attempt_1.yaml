rule_id: R_I3_flat
description: No reversing on interstate; true longitudinal ego velocity must never drop below -0.3 m/s. Plant may move backwards only when reverse gear is commanded.
sampling_rate_hz: 10
horizon: 10
constants:
  V_MIN: -0.3
environment:
  signals:
    - {name: true_long_vel, sort: real}
    - {name: reverse_gear_cmd, sort: bool}
formula: "G((true_long_vel >= V_MIN) and ((true_long_vel < 0) -> reverse_gear_cmd))"