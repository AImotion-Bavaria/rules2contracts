rule_id: R_I3_flat
description: No reversing on the interstate; true longitudinal ego velocity must never drop below -0.3 m/s.
sampling_rate_hz: 10
horizon: 1
constants:
  V_MIN: -0.3
environment:
  signals:
    - {name: true_ego_velocity, sort: real}
    - {name: reverse_gear_cmd, sort: bool}
formula: "G((reverse_gear_cmd) -> (true_ego_velocity >= V_MIN))"