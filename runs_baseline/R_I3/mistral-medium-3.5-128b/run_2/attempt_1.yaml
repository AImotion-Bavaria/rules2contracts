rule_id: R_I3_flat
description: No reversing on the interstate; true longitudinal ego velocity must never drop below -0.3 m/s.
sampling_rate_hz: 10
horizon: 1
constants:
  V_MIN: -0.3
environment:
  signals:
    - {name: true_longitudinal_velocity, sort: real}
formula: "G(true_longitudinal_velocity >= V_MIN)"