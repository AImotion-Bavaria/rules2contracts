rule_id: R_I3_flat
description: No reversing manoeuvres on the interstate.
sampling_rate_hz: 10
horizon: 8
constants:
  V_MIN: -0.3
environment:
  signals:
    - {name: reverse_gear_cmd, sort: bool}
    - {name: reverse_gear, sort: bool}
    - {name: true_longitudinal_velocity, sort: real}
formula: "G(not reverse_gear_cmd -> F[0,8](true_longitudinal_velocity >= V_MIN))"