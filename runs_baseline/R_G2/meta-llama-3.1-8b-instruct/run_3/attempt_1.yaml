rule_id: R_G2_flat
description: Unnecessary braking: commanded deceleration > 2.0 m/s^2 is only permitted when gap is critical.
sampling_rate_hz: 10
horizon: 8
constants:
  GAP_THRESHOLD: 20.0
  GAP_ERROR: 2.0
  DECEL_THRESHOLD: 2.0
  DECEL_ERROR: 0.5
environment:
  signals:
    - {name: gap, sort: real}
    - {name: commanded_deceleration, sort: real}
    - {name: preceding_vehicle_in_front, sort: bool}
formula: "G((commanded_deceleration > DECEL_THRESHOLD) -> (preceding_vehicle_in_front -> F[0,3](gap <= GAP_THRESHOLD - GAP_ERROR)))"