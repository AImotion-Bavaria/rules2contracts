rule_id: R_G2_flat
description: Unnecessary braking prohibition where commanded deceleration above threshold requires critical gap, accounting for perception uncertainty.
sampling_rate_hz: 10
horizon: 8
constants:
  DEC_THRESH: 2.0
  GAP_THRESH: 20.0
  GAP_ERROR: 2.0
environment:
  signals:
    - {name: dec_cmd, sort: real}
    - {name: gap, sort: real}
formula: "G((dec_cmd > DEC_THRESH) -> (gap < (GAP_THRESH - GAP_ERROR)))"