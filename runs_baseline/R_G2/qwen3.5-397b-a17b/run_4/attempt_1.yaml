rule_id: R_G2_flat
description: StVO §4(1) unnecessary braking robust to plant tracking error; strong commanded deceleration requires critical gap.
sampling_rate_hz: 10
horizon: 10
constants:
  ACC_CMD_SAFE_LIMIT_NEG: -1.5
  GAP_CRITICAL_LIMIT: 20.0
environment:
  signals:
    - {name: acc_cmd, sort: real}
    - {name: gap_true, sort: real}
formula: "G((acc_cmd < ACC_CMD_SAFE_LIMIT_NEG) -> (gap_true < GAP_CRITICAL_LIMIT))"