rule_id: R_G2_flat
description: Unnecessary braking rule accounting for perception and plant uncertainty.
sampling_rate_hz: 10
horizon: 8
constants:
  DECEL_TRIGGER: -1.5
  GAP_THRESHOLD: 18.0
environment:
  signals:
    - {name: acc_cmd, sort: real}
    - {name: gap_meas, sort: real}
formula: "G((acc_cmd < DECEL_TRIGGER) -> (gap_meas < GAP_THRESHOLD))"