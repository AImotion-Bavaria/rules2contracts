rule_id: R_G2_flat
description: >
  StVO §4(1) unnecessary-braking rule: a commanded deceleration stronger
  than 2.0 m/s^2 is only permitted when the gap to the preceding vehicle
  is critical (below 20.0 m). Perception gap error (±2.0 m) and plant
  acceleration tracking error (±0.5 m/s^2) are absorbed as tolerance
  margins so the rule is checked on the physically realizable state.
sampling_rate_hz: 20
horizon: 5
constants:
  BRAKE_THRESH: 2.0
  GAP_CRIT: 20.0
  GAP_ERR: 2.0
  ACCEL_TOL: 0.5
environment:
  signals:
    - {name: accel_cmd, sort: real}
    - {name: gap, sort: real}
formula: "G((accel_cmd <= -(BRAKE_THRESH - ACCEL_TOL)) -> (gap <= GAP_CRIT + GAP_ERR))"