rule_id: R_G2_flat
description: "Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason. A commanded deceleration stronger than 2.0 m/s^2 is only permitted when the true gap to the preceding vehicle is below 20.0 m."
sampling_rate_hz: 10
horizon: 10
constants:
  DECEL_THRESH: 2.0
  GAP_THRESH: 20.0
environment:
  signals:
    - {name: accel_cmd, sort: real}
    - {name: gap_true, sort: real}
formula: "G((accel_cmd <= -DECEL_THRESH) -> (gap_true < GAP_THRESH))"