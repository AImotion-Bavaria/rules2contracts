rule_id: R_G2_flat
description: Unnecessary braking (StVO §4(1)): vehicles must not brake abruptly without reason. Commanded deceleration stronger than 2.0 m/s² is only permitted when the true gap to the preceding vehicle is below 20.0 m.
sampling_rate_hz: 10
horizon: 8
constants:
  DECEL_THRESH: 2.0
  GAP_THRESH: 20.0
  GAP_ERR: 2.0
  ACC_ERR: 0.5
environment:
  signals:
    - {name: acc_cmd, sort: real}
    - {name: gap_true, sort: real}
    - {name: acc_true, sort: real}
    - {name: gap_est, sort: real}
formula: "G((acc_cmd < -DECEL_THRESH) -> (gap_true < GAP_THRESH))"