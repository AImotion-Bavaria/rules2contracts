rule_id: R_G2_flat
description: Vehicles must not apply a deceleration stronger than 2.0 m/s² unless the estimated gap to the preceding vehicle is critical (≤ 20 m). Accounting for perception error (±2 m) and plant tracking error (±0.5 m/s²), the rule is enforced on the commanded acceleration and the estimated gap.
sampling_rate_hz: 10
horizon: 5
constants:
  DECEL_LIMIT: 2.5        # 2.0 m/s² + 0.5 m/s² tracking error
  GAP_LIMIT: 18.0         # 20.0 m - 2.0 m perception error
environment:
  signals:
    - {name: accel_cmd, sort: real}
    - {name: gap_est, sort: real}
formula: "G((accel_cmd <= -DECEL_LIMIT) -> (gap_est <= GAP_LIMIT))"