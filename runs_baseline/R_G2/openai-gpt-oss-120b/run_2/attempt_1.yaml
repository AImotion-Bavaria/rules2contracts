rule_id: R_G2_flat
description: Vehicles must not brake abruptly without reason; a commanded deceleration stronger than 2.0 m/s² is allowed only when the estimated gap to the preceding vehicle is critical (considering perception error).
sampling_rate_hz: 10
horizon: 5
constants:
  DECEL_THR: 2.0
  GAP_CRIT: 20.0
  GAP_ERR: 2.0
  ACC_ERR: 0.5
environment:
  signals:
    - {name: a_cmd, sort: real}
    - {name: gap_est, sort: real}
formula: "G(((a_cmd - ACC_ERR) <= -DECEL_THR) -> ((gap_est - GAP_ERR) < GAP_CRIT))"