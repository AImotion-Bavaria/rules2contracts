rule_id: R_G2_flat
description: Unnecessary braking – a commanded deceleration stronger than 2.0 m/s² is allowed only when the estimated gap to the preceding vehicle is critical (below 20 m), accounting for perception and actuation errors.
sampling_rate_hz: 10
horizon: 5
constants:
  DECEL_STRONG: 2.0        # threshold for strong deceleration (m/s²)
  GAP_CRIT: 20.0           # critical gap (m)
  GAP_ERR: 2.0             # perception gap error bound (m)
  ACCEL_ERR: 0.5           # actuation acceleration tracking error (m/s²)
environment:
  signals:
    - {name: accel_cmd, sort: real}   # commanded longitudinal acceleration (m/s²)
    - {name: gap_est, sort: real}     # estimated gap to preceding vehicle (m)
formula: "G((accel_cmd <= -(DECEL_STRONG + ACCEL_ERR)) -> (gap_est + GAP_ERR < GAP_CRIT))"
