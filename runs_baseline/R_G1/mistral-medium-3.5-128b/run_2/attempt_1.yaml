rule_id: R_G1_flat
description: Safe distance to the preceding vehicle (StVO §4(1)) – time-gap interpretation with perception and localization errors
sampling_rate_hz: 10
horizon: 3
constants:
  MIN_GAP_TIME: 1.8
  PERCEPTION_ERROR: 2.0
  LOCALIZATION_ERROR: 0.5
  REACTION_STEPS: 3
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_ego_velocity, sort: real}
    - {name: hazard_notification, sort: bool}
formula: "G((true_gap < MIN_GAP_TIME * true_ego_velocity) -> F[0,REACTION_STEPS](hazard_notification))"