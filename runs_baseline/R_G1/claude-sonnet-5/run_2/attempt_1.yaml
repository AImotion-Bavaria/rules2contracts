rule_id: R_G1_flat
description: >
  StVO §4(1) safe-distance rule (time-gap interpretation): whenever the true
  gap to the preceding vehicle falls below 1.8 s times the true ego velocity,
  a hazard notification must be raised within 300 ms (3 steps at 10 Hz).
sampling_rate_hz: 10
horizon: 3
constants:
  T_GAP: 1.8
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_ego_velocity, sort: real}
    - {name: hazard_notification, sort: bool}
formula: "G((true_gap < T_GAP * true_ego_velocity) -> F[0,3](hazard_notification))"