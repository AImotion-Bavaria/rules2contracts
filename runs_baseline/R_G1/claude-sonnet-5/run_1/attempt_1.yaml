rule_id: R_G1_flat
description: >
  StVO §4(1) safe-distance rule (time-gap interpretation): whenever the true
  gap to the preceding vehicle falls below 1.8 s times the true ego
  velocity, a hazard notification must be raised within 300 ms (3 steps at
  10 Hz). Perception's gap estimate carries a bounded error of 2.0 m and
  Localization's velocity estimate carries a bounded error of 0.5 m/s;
  these are declared as constants for context but the rule itself is stated
  over the true physical quantities.
sampling_rate_hz: 10
horizon: 3
constants:
  TIME_GAP_S: 1.8
  PERCEPTION_ERROR_M: 2.0
  VELOCITY_ERROR_MPS: 0.5
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_velocity, sort: real}
    - {name: hazard, sort: bool}
formula: "G((true_gap < TIME_GAP_S * true_velocity) -> F[0,3](hazard))"