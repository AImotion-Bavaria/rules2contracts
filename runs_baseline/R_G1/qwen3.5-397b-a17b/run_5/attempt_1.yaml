rule_id: R_G1_flat
description: Safe distance violation requires hazard notification within 300ms.
sampling_rate_hz: 10
horizon: 10
constants:
  TIME_GAP: 1.8
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_velocity, sort: real}
    - {name: hazard_notification, sort: bool}
formula: "G((true_gap < TIME_GAP * true_velocity) -> F[0,3](hazard_notification))"