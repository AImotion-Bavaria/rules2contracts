rule_id: R_G1_flat
description: 'Safe distance (StVO §4(1)): Hazard notification within 300ms if true time gap falls below 1.8s times ego velocity.'
sampling_rate_hz: 10
horizon: 4
constants:
  TIME_GAP_THRESHOLD: 1.8
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_velocity, sort: real}
    - {name: hazard_notification, sort: bool}
formula: "G((true_gap < (TIME_GAP_THRESHOLD * true_velocity)) -> F[0,3](hazard_notification))"