rule_id: R_G1_flat
description: Safe distance to preceding vehicle (StVO §4(1)): If true gap falls below 1.8s times true ego velocity, hazard notification must be raised within 300ms.
sampling_rate_hz: 10
horizon: 3
constants:
  TIME_GAP_THRESHOLD: 1.8
environment:
  signals:
    - {name: true_gap, sort: real}
    - {name: true_velocity, sort: real}
    - {name: hazard_notification, sort: bool}
formula: "G((true_gap < TIME_GAP_THRESHOLD * true_velocity) -> F[0,3](hazard_notification))"