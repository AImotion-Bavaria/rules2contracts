rule_id: R_G1_flat
description: Safe distance to the preceding vehicle – if the true gap falls below 1.8 s × ego velocity, a hazard notification must be raised within 300 ms.
sampling_rate_hz: 10
horizon: 3
constants:
  TGAP: 1.8
  GAP_ERR: 2.0
  VEL_ERR: 0.5
environment:
  signals:
    - {name: gap_est, sort: real}
    - {name: vel_est, sort: real}
    - {name: hazard, sort: bool}
formula: "G(((gap_est - GAP_ERR) < TGAP * (vel_est + VEL_ERR)) -> F[0,3](hazard))"