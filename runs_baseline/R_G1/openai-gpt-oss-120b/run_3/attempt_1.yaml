rule_id: R_G1_flat
description: Safe distance to the preceding vehicle – if the true gap falls below 1.8 s times the true ego velocity, a hazard notification must be raised within 300 ms.
sampling_rate_hz: 10
horizon: 3
constants:
  TIME_GAP: 1.8
environment:
  signals:
    - {name: gap_true, sort: real}
    - {name: vel_true, sort: real}
    - {name: hazard, sort: bool}
formula: "G((gap_true < TIME_GAP * vel_true) -> F[0,3](hazard))"