# Faulty variant of R_G1 (for demonstration): the Planning threshold forgets
# to compensate the localization velocity error bound (TAU * v_ego instead
# of TAU * (v_ego + EPS_V)). Expected: V3b fails with a counterexample trace.

rule_id: R_G1_faulty
description: >
  Same rule as R_G1, but the Planning sub-contract omits the velocity-error
  compensation — a subtle, plausible LLM mistake.
sampling_rate_hz: 10
horizon: 8

constants:
  TAU: 1.8
  EPS_V: 0.5
  EPS_D: 2.0
  V_MAX: 70.0
  D_MAX: 200.0

environment:
  signals:
    - {name: d_gap, sort: real}
    - {name: v_true, sort: real}

system_contract:
  interface: {inputs: [d_gap, v_true], outputs: [hazard_on]}
  assumption: "G(d_gap >= 0 and d_gap <= D_MAX and v_true >= 0 and v_true <= V_MAX)"
  guarantee: "G((d_gap <= TAU * v_true) -> F[0,3](hazard_on))"

decomposition:
  discharge_order: [Localization, Perception, Planning]
  contracts:
    - service: Localization
      interface: {inputs: [v_true], outputs: [v_ego]}
      assumption: "G(v_true >= 0 and v_true <= V_MAX)"
      guarantee: "G(abs(v_ego - v_true) <= EPS_V)"

    - service: Perception
      interface: {inputs: [d_gap], outputs: [d_lead]}
      assumption: "G(d_gap >= 0 and d_gap <= D_MAX)"
      guarantee: "G(abs(d_lead - d_gap) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead, v_ego], outputs: [hazard_on]}
      assumption: "G(d_lead >= 0 - EPS_D and v_ego >= 0 - EPS_V)"
      guarantee: "G((d_lead <= TAU * v_ego + EPS_D) -> F[0,3](hazard_on))"
