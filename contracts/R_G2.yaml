# Rule R_G2 "unnecessary braking" (interstate rule corpus, Maierhofer et al.,
# IV 2021), traced back to StVO §4(1). Feature-level instance: abrupt braking
# is only permitted when the gap to the lead vehicle is critical. The
# congestion/obstacle exceptions of the full predicate are out of scope of
# the feature vocabulary (documented exclusion).

rule_id: R_G2
description: >
  Unnecessary braking: the vehicle must not brake abruptly (commanded
  deceleration below -A_ABRUPT) unless the perceived gap to the preceding
  vehicle is critical (below D_CRIT). The plant tracks the commanded
  acceleration within DELTA_A (system-level assumption).
source_text: >
  StVO §4(1); Maierhofer et al. (IV 2021), R_G2:
  "G(¬unnecessary_braking(x_ego, X_other))" — vehicles must not brake
  abruptly without reason.
sampling_rate_hz: 10
horizon: 8

constants:
  A_ABRUPT: 2.0   # abrupt-braking threshold [m/s^2] (magnitude)
  DELTA_A: 0.5    # plant acceleration-tracking tolerance [m/s^2]
  EPS_D: 2.0      # perception gap error bound [m]
  D_CRIT: 20.0    # critical gap below which hard braking is justified [m]
  D_MAX: 200.0

environment:
  signals:
    - {name: d_gap, sort: real}    # true gap to lead vehicle [m]
    - {name: a_true, sort: real}   # true ego acceleration [m/s^2]

system_contract:
  interface: {inputs: [d_gap, a_true], outputs: [a_plan]}
  assumption: "G(d_gap >= 0 and d_gap <= D_MAX and abs(a_true - a_plan) <= DELTA_A)"
  guarantee: "G((a_true <= 0 - A_ABRUPT - DELTA_A) -> (d_gap <= D_CRIT + EPS_D))"

decomposition:
  discharge_order: [Perception, Planning]
  contracts:
    - service: Perception
      interface: {inputs: [d_gap], outputs: [d_lead]}
      assumption: "G(d_gap >= 0 and d_gap <= D_MAX)"
      guarantee: "G(abs(d_lead - d_gap) <= EPS_D)"

    - service: Planning
      interface: {inputs: [d_lead], outputs: [a_plan]}
      assumption: "G(d_lead >= 0 - EPS_D)"
      guarantee: "G((a_plan <= 0 - A_ABRUPT) -> (d_lead <= D_CRIT))"
